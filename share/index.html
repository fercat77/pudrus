<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <meta name="robots" content="noindex">
  <title>Abrir con… — PUDRUS.XYZ</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/tool-shell.css">
  <style>
    .share-wrap { max-width: 720px; margin: 0 auto; }
    .share-preview { display: flex; justify-content: center; margin: 8px 0 24px; }
    .share-preview img, .share-preview video { max-width: 100%; max-height: 42vh; border: 1px solid var(--border); background: var(--bg2); }
    .share-tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .share-tools .ts-chip { min-height: 52px; border-radius: 10px; font-size: 13px; }
    .share-empty { color: var(--text2); font-size: 13px; line-height: 1.7; }
  </style>
</head>
<body class="home">

<nav id="nav">
  <a href="/" class="nav-logo">PUDRUS<span>.xyz</span></a>
  <div class="nav-lang">
    <select id="langSelect" aria-label="Language selector">
      <option value="es">ES</option>
      <option value="en">EN</option>
    </select>
  </div>
</nav>

<main>
  <section class="screen">
    <div class="share-wrap">
      <div class="section-tag" data-i18n="share.tag">◈ Shared with PUDRUS</div>
      <h1 class="section-title" data-i18n="share.title">Open with…</h1>
      <div class="share-preview" id="preview"></div>
      <div class="share-tools" id="tools"></div>
      <p class="share-empty" id="empty" hidden data-i18n="share.empty">Nothing was received. Share an image or a video from your phone's gallery and pick PUDRUS.</p>
    </div>
  </section>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/pwa.js"></script>
<script>
(async function () {
  const t = (k, fb) => (window.pudrusT ? window.pudrusT(k, fb) : fb);
  const IMAGE_TOOLS = [
    ['glitch', 'tools.glitch.name', 'Glitch FX'], ['dithering', 'tools.dither.name', 'Dithering'],
    ['halftone', 'tools.halftone.name', 'Halftone'], ['pixel-sort', 'tools.pixel.name', 'Pixel Sorter'],
    ['crt-bend', 'tools.crt.name', 'CRT Bend'], ['triangulation', 'tools.triangulation.name', 'Triangulation'],
    ['ascii-canvas', 'tools.ascii.name', 'ASCII Canvas'], ['constellation', 'tools.constellation.name', 'Constellation'],
    ['flyer-forge', 'tools.flyer.name', 'Flyer Forge'], ['camera-fx', 'tools.camera.name', 'Camera FX'],
  ];
  const preview = document.getElementById('preview'), tools = document.getElementById('tools'), empty = document.getElementById('empty');
  const chip = (dir, key, fb, onclick) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ts-chip'; b.setAttribute('data-i18n', key); b.textContent = t(key, fb);
    b.addEventListener('click', onclick);
    return b;
  };

  let blob = null;
  try {
    const cache = await caches.open('pudrus-share');
    const res = await cache.match('/__shared-media');
    if (res) blob = await res.blob();
  } catch (e) { /* no cache API */ }
  if (!blob || !blob.size) { empty.hidden = false; return; }

  const url = URL.createObjectURL(blob);
  if (blob.type.startsWith('video/')) {
    // Video: Camera FX reads it straight from the cache
    const v = document.createElement('video');
    v.src = url; v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true; v.setAttribute('playsinline', '');
    preview.append(v);
    tools.append(chip('camera-fx', 'tools.camera.name', 'Camera FX', () => { location.href = '/tools/camera-fx/?shared=1'; }));
    return;
  }

  const img = new Image();
  img.src = url;
  preview.append(img);
  await new Promise(r => { img.onload = r; img.onerror = r; });
  // Same hand-off as "Send to…": a downscaled copy in sessionStorage
  function handOff(dir) {
    const max = 2048, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    try { sessionStorage.setItem('pudrus_workflow_image', c.toDataURL('image/png')); }
    catch (e) { sessionStorage.setItem('pudrus_workflow_image', c.toDataURL('image/jpeg', 0.9)); }
    caches.open('pudrus-share').then(cc => cc.delete('/__shared-media')).catch(() => {});
    location.href = '/tools/' + dir + '/';
  }
  IMAGE_TOOLS.forEach(([dir, key, fb]) => tools.append(chip(dir, key, fb, () => handOff(dir))));
})();
</script>
</body>
</html>
