<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Control — PUDRUS Lab</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { --bg: #0a0a10; --panel: #15151d; --panel2: #1d1d27; --line: #2b2b38; --text: #e3e5ee; --dim: #8a8ea3; --accent: #66ff33; --red: #ff2a4d; --pink: #ff3fa4; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); color: var(--text); font: 14px ui-monospace, Menlo, Consolas, monospace; }
    body { padding: max(10px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    button { font: inherit; color: inherit; border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; cursor: pointer; touch-action: manipulation; }
    button:disabled { opacity: 0.4; }
    header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 4px 0 8px; background: var(--bg); }
    header h1 { font-size: 13px; letter-spacing: 2px; color: var(--accent); }
    header h1 span { color: var(--dim); font-weight: 400; }
    #status { flex: 1; color: var(--dim); font-size: 12px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #555; flex: none; }
    .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .dot.wait { background: #ffd166; }
    .hbtn { flex: none; width: 40px; height: 34px; font-size: 16px; }
    .hbtn.on { border-color: var(--accent); color: var(--accent); }
    #lock.on { border-color: var(--red); background: #3a0f18; }
    h2 { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 1.5px; color: var(--dim); font-weight: 400; margin: 14px 2px 8px; text-transform: uppercase; }
    h2 .sp { flex: 1; }
    h2 button { height: 28px; padding: 0 10px; font-size: 12px; letter-spacing: 0; text-transform: none; }
    h2 button.on { border-color: var(--accent); color: var(--accent); }
    .video { position: relative; aspect-ratio: 16 / 9; background: #000; border: 2px solid var(--red); border-radius: 10px; overflow: hidden; margin-bottom: 6px; }
    .video video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .video span { position: absolute; left: 6px; top: 5px; font-size: 10px; letter-spacing: 1px; color: #ff6680; background: rgba(0,0,0,0.6); padding: 1px 5px; border-radius: 4px; }
    .video[hidden] { display: none; }
    .scenes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .scene { position: relative; aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; border-radius: 8px; padding: 0; }
    .scene.empty { background: var(--panel); border-style: dashed; color: var(--dim); }
    .scene.live { border: 2px solid var(--red); box-shadow: 0 0 12px rgba(255,42,77,0.5); }
    .scene.saved { animation: saved .6s ease-out; }
    @keyframes saved { from { box-shadow: 0 0 0 6px rgba(102,255,51,0.8); } }
    .scene b { position: absolute; left: 5px; top: 4px; padding: 0 5px; border-radius: 4px; background: rgba(0,0,0,0.65); font-size: 12px; }
    .scene:active { transform: scale(0.96); }
    .hint { color: var(--dim); font-size: 11px; margin-top: 6px; }
    .row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
    .row button { height: 60px; font-size: 15px; font-weight: 700; }
    .row2 { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin-top: 8px; }
    #ovl.on { border-color: var(--accent); color: var(--accent); }
    .row2 button { height: 44px; }
    #go { background: #4a1220; border-color: var(--red); }
    #go:active { background: var(--red); }
    #black.on { background: #000; border-color: var(--red); color: var(--red); }
    #strobe.on { background: #fff; color: #000; }
    #tap small { display: block; font-size: 11px; font-weight: 400; color: var(--accent); }
    .fades { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .fades button { height: 38px; }
    .fades button.on { border-color: var(--accent); color: var(--accent); }
    #ctls { display: flex; flex-direction: column; gap: 10px; }
    .fader { position: relative; height: 56px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; touch-action: none; }
    .fader i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, rgba(255,63,164,0.35), rgba(255,63,164,0.7)); }
    .fader em { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: #fff; opacity: 0; }
    .fader.wait em { opacity: 0.8; }
    .fader.wait { border-color: #ffd166; }
    .fader span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; text-shadow: 0 1px 2px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 24px); }
    .fader span b, .pad b, .xy b { color: var(--pink); margin-right: 8px; }
    .fader.active { border-color: var(--pink); }
    .pad { height: 64px; border-radius: 10px; font-weight: 700; touch-action: none; border-color: var(--pink); }
    .pad.on { background: var(--pink); color: #000; }
    .pad.on b { color: #000; }
    .xy { position: relative; aspect-ratio: 1.6; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); touch-action: none; overflow: hidden;
          background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 25% 25%; }
    .xy span { position: absolute; left: 10px; top: 8px; pointer-events: none; font-size: 12px; }
    .xy i { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 2px solid var(--pink); background: rgba(255,63,164,0.35); pointer-events: none; }
    .xy.active { border-color: var(--pink); }
    .xf-row { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: stretch; }
    .deck { height: 52px; font-size: 18px; font-weight: 700; }
    .deck.on { border-color: var(--red); color: #ff6680; background: #2a0d15; }
    .xfader { position: relative; height: 52px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; touch-action: none; }
    .xfader i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: linear-gradient(90deg, rgba(255,42,77,0.25), rgba(255,42,77,0.6)); }
    .xfader span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 12px; pointer-events: none; }
    .xfader.active { border-color: var(--red); }
    .empty-msg { color: var(--dim); line-height: 1.6; padding: 10px 2px; }
    .nohash { margin-top: 30vh; text-align: center; color: var(--dim); line-height: 1.7; }
    #lockLayer { position: fixed; inset: 0; z-index: 10; display: none; }
    body.locked #lockLayer { display: block; }
    body.locked main { opacity: 0.55; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 30; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; background: rgba(15,15,22,0.95); border: 1px solid var(--line); opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
    .toast.on { opacity: 1; }
    @media (min-width: 700px) { main { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; } }
    /* landscape phone: a console, vertical faders */
    @media (orientation: landscape) and (max-height: 560px) {
      main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 0 16px; }
      #ctls { flex-direction: row; flex-wrap: wrap; align-items: stretch; }
      .fader { width: 62px; height: 220px; flex: none; }
      .fader i { inset: auto 0 0 0; width: auto; height: 0; background: linear-gradient(0deg, rgba(255,63,164,0.35), rgba(255,63,164,0.7)); }
      .fader em { left: 0; right: 0; top: auto; width: auto; height: 3px; margin: 0 0 -1px; }
      .fader span { left: 50%; top: auto; bottom: 8px; transform: translateX(-50%) rotate(180deg); writing-mode: vertical-rl; max-width: none; max-height: 200px; }
      .pad { width: 120px; height: 100px; }
      .xy { width: 260px; aspect-ratio: auto; height: 220px; }
    }
  </style>
</head>
<body>
<header>
  <i class="dot" id="dot"></i>
  <h1>PUDRUS <span>control</span></h1>
  <span id="status">conectando…</span>
  <button class="hbtn" id="eye" title="Ver lo que está al aire">👁</button>
  <button class="hbtn" id="lock" title="Bloquear (mantener para desbloquear)">🔓</button>
</header>
<div id="lockLayer"></div>
<main id="main" hidden>
  <section>
    <div class="video" id="videoBox" hidden><video id="video" playsinline muted autoplay></video><span>● EN VIVO</span></div>
    <h2>Escenas <i class="sp"></i>
      <button id="prev" title="Escena anterior">◀</button><button id="next" title="Escena siguiente">▶</button>
      <button id="pg0" class="on">1–8</button><button id="pg1">9–16</button></h2>
    <div class="scenes" id="scenes"></div>
    <p class="hint">Mantené apretada una escena para guardar ahí lo que está en el editor.</p>
    <div class="row">
      <button id="go">⏵ AL AIRE</button>
      <button id="black">■ Negro</button>
      <button id="strobe">✦ Strobe</button>
      <button id="tap">TAP<small id="bpm">120</small></button>
    </div>
    <div class="row2">
      <button id="random">🎲 Aleatorio</button>
      <button id="vary">✨ Variar</button>
      <button id="ovl" hidden>▤ Capa</button>
    </div>
    <h2>Fundido</h2>
    <div class="fades" id="fades"></div>
  </section>
  <section>
    <h2>Capas A / B</h2>
    <div class="xf-row">
      <button id="dA" class="deck">A</button>
      <div class="xfader" id="xf"><i></i><span>◀ A · crossfader · B ▶</span></div>
      <button id="dB" class="deck">B</button>
    </div>
    <h2>Controles</h2>
    <div id="ctls"></div>
  </section>
</main>
<p class="nohash" id="nohash" hidden>Abrí este control escaneando el código QR<br>desde «📱 Control» en el editor de nodos.</p>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const room = decodeURIComponent(location.hash.slice(1));
  if (!/^pudrus-[a-z0-9]{6,32}$/.test(room)) { $('nohash').hidden = false; $('status').textContent = ''; return; }

  let peer = null, conn = null, state = null, retry = null, page = 0, videoOn = false;
  function status(txt, kind) { $('status').textContent = txt; $('dot').className = 'dot ' + (kind || ''); }
  function send(m) { if (conn && conn.open && !locked) conn.send(m); }
  let toastT;
  function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 1600); }

  /* ── connection ── */
  function connect() {
    clearTimeout(retry);
    if (!window.Peer) { status('sin internet', ''); retry = setTimeout(() => location.reload(), 4000); return; }
    if (!peer || peer.destroyed) {
      peer = new window.Peer({ debug: 0 });
      peer.on('open', open);
      peer.on('error', err => {
        status(err.type === 'peer-unavailable' ? 'el editor no está abierto' : 'sin conexión', 'wait');
        retry = setTimeout(connect, 2500);
      });
      peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) { /* ignore */ } });
      // video of what is on air (the editor calls us)
      peer.on('call', call => {
        call.answer();
        call.on('stream', st => { const v = $('video'); v.srcObject = st; v.play().catch(() => {}); });
      });
    } else if (peer.open) open();
  }
  function open() {
    status('conectando…', 'wait');
    conn = peer.connect(room, { reliable: true });
    conn.on('open', () => { status('conectado', 'on'); if (videoOn) conn.send({ t: 'video', on: true }); });
    conn.on('data', onData);
    conn.on('close', () => { status('se cortó · reintentando', 'wait'); retry = setTimeout(connect, 1500); });
    conn.on('error', () => { retry = setTimeout(connect, 2500); });
  }
  function onData(m) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'state') { state = m; render(); }
    else if (m.t === 'vals' && state && Array.isArray(m.v)) {
      m.v.forEach((v, i) => { const c = state.controls[i]; if (c && !touching.has(i)) { c.v = v; paintCtl(i); } });
    }
  }

  /* ── UI ── */
  const FADES = [[0, 'Corte'], [0.5, '0,5 s'], [1, '1 s'], [2, '2 s'], [4, '4 s']];
  const touching = new Set();
  const vertical = () => matchMedia('(orientation: landscape) and (max-height: 560px)').matches;
  function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
  function label(e, i, txt) { e.append(el('b', '', String(i + 1)), document.createTextNode(txt)); }

  function renderScenes() {
    const sc = $('scenes'); sc.textContent = '';
    for (let i = page * 8; i < page * 8 + 8; i++) {
      const s = state.scenes[i] || {};
      const b = el('button', 'scene' + (s.filled ? '' : ' empty') + (s.live ? ' live' : ''));
      if (s.thumb && /^data:image\/(jpeg|png);base64,[A-Za-z0-9+/=]+$/.test(s.thumb)) b.style.backgroundImage = `url("${s.thumb}")`;
      b.append(el('b', '', String(i + 1)));
      // tap = on air · long press = store what is in the editor here
      let hold = null, held = false;
      b.addEventListener('pointerdown', () => { held = false; hold = setTimeout(() => { held = true; send({ t: 'store', i }); buzz(40); b.classList.add('saved'); toast(`Escena ${i + 1} guardada`); }, 650); });
      const cancel = () => clearTimeout(hold);
      b.addEventListener('pointerup', () => { cancel(); if (!held && s.filled) { send({ t: 'scene', i }); buzz(); } });
      b.addEventListener('pointerleave', cancel); b.addEventListener('pointercancel', cancel);
      b.addEventListener('contextmenu', e => e.preventDefault());
      sc.append(b);
    }
    $('pg0').classList.toggle('on', page === 0); $('pg1').classList.toggle('on', page === 1);
  }
  function render() {
    $('main').hidden = false;
    renderScenes();
    $('black').classList.toggle('on', !!state.black);
    $('bpm').textContent = state.bpm;
    $('ovl').hidden = state.overlay === null || state.overlay === undefined;
    $('dA').classList.toggle('on', state.deck !== 'B'); $('dB').classList.toggle('on', state.deck === 'B');
    if (!xfTouch) $('xf').querySelector('i').style.width = ((state.xf || 0) * 100) + '%';
    $('ovl').classList.toggle('on', !!state.overlay);
    const fd = $('fades'); fd.textContent = '';
    FADES.forEach(([v, l]) => { const b = el('button', state.fade === v ? 'on' : '', l); b.addEventListener('click', () => send({ t: 'fade', v })); fd.append(b); });
    const box = $('ctls'); box.textContent = '';
    if (!state.controls.length) box.append(el('p', 'empty-msg', 'El patch que está al aire no tiene controles. En el editor: clic derecho sobre un valor → «Al control».'));
    state.controls.forEach((c, i) => {
      let e;
      if (c.kind === 'xy') { e = el('div', 'xy'); const s = el('span'); label(s, i, c.label); e.append(s, el('i')); bindXY(e, i); }
      else if (c.kind === 'button') { e = el('button', 'pad'); label(e, i, c.label); bindPad(e, i); }
      else { e = el('div', 'fader'); const s = el('span'); label(s, i, c.label); e.append(el('i'), el('em'), s); bindFader(e, i); }
      e.dataset.i = i;
      box.append(e);
      paintCtl(i);
    });
  }
  function paintCtl(i) {
    const c = state.controls[i], e = document.querySelector(`#ctls [data-i="${i}"]`);
    if (!c || !e) return;
    if (c.kind === 'xy') { const d = e.querySelector('i'); d.style.left = (c.v[0] * 100) + '%'; d.style.top = ((1 - c.v[1]) * 100) + '%'; }
    else if (c.kind === 'button') e.classList.toggle('on', !!c.v);
    else { const f = e.querySelector('i'); if (vertical()) { f.style.height = (c.v * 100) + '%'; f.style.width = ''; } else { f.style.width = (c.v * 100) + '%'; f.style.height = ''; } }
  }
  // throttled sending (≈30 per second) that always delivers the last value
  function sender() {
    let last = 0, t = null;
    return m => { const now = performance.now(); clearTimeout(t); if (now - last > 33) { last = now; send(m); } else t = setTimeout(() => { last = performance.now(); send(m); }, 36); };
  }
  // Faders "pick up" the value: if you touch far from where it is, it waits until your
  // finger passes the current value, so nothing jumps on air.
  function bindFader(f, i) {
    const out = sender();
    let armed = false, prev = 0;
    const pos = e => { const r = f.getBoundingClientRect(); return vertical() ? 1 - (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width; };
    const ghost = v => { const g = f.querySelector('em'); if (vertical()) { g.style.bottom = (v * 100) + '%'; g.style.left = ''; } else { g.style.left = (v * 100) + '%'; g.style.bottom = ''; } };
    const move = e => {
      const c = state.controls[i]; if (!c) return;
      const v = Math.min(1, Math.max(0, pos(e)));
      if (!armed && (Math.abs(v - c.v) < 0.05 || (prev - c.v) * (v - c.v) <= 0)) { armed = true; f.classList.remove('wait'); }
      prev = v;
      if (armed) { c.v = v; paintCtl(i); out({ t: 'ctl', i, v }); } else ghost(v);
    };
    f.addEventListener('pointerdown', e => {
      f.setPointerCapture(e.pointerId); touching.add(i); f.classList.add('active'); wake();
      const c = state.controls[i]; const v = Math.min(1, Math.max(0, pos(e)));
      armed = !c || Math.abs(v - c.v) < 0.06; prev = v;
      if (!armed) { f.classList.add('wait'); ghost(v); }
      move(e);
    });
    f.addEventListener('pointermove', e => { if (touching.has(i)) move(e); });
    const end = () => { touching.delete(i); f.classList.remove('active', 'wait'); };
    f.addEventListener('pointerup', end); f.addEventListener('pointercancel', end);
  }
  function bindXY(p, i) {
    const out = sender();
    const move = e => {
      const r = p.getBoundingClientRect(), c = state.controls[i];
      const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y = Math.min(1, Math.max(0, 1 - (e.clientY - r.top) / r.height));
      c.v = [x, y]; paintCtl(i); out({ t: 'xy', i, x, y });
    };
    p.addEventListener('pointerdown', e => { p.setPointerCapture(e.pointerId); touching.add(i); p.classList.add('active'); wake(); move(e); });
    p.addEventListener('pointermove', e => { if (touching.has(i)) move(e); });
    const end = () => { touching.delete(i); p.classList.remove('active'); };
    p.addEventListener('pointerup', end); p.addEventListener('pointercancel', end);
  }
  function bindPad(b, i) {
    b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); touching.add(i); b.classList.add('on'); send({ t: 'btn', i, on: true }); buzz(); });
    const up = () => { if (!touching.has(i)) return; touching.delete(i); b.classList.remove('on'); send({ t: 'btn', i, on: false }); };
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, up));
    b.addEventListener('contextmenu', e => e.preventDefault());
  }

  // crossfader A ⇄ B and deck select
  let xfTouch = false;
  (() => {
    const f = $('xf'), out = sender();
    const at = e => { const r = f.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
    const set = e => { const v = at(e); f.querySelector('i').style.width = (v * 100) + '%'; if (state) state.xf = v; out({ t: 'xf', v }); };
    f.addEventListener('pointerdown', e => { f.setPointerCapture(e.pointerId); xfTouch = true; f.classList.add('active'); set(e); wake(); });
    f.addEventListener('pointermove', e => { if (xfTouch) set(e); });
    const end = () => { xfTouch = false; f.classList.remove('active'); };
    f.addEventListener('pointerup', end); f.addEventListener('pointercancel', end);
  })();
  $('dA').addEventListener('click', () => { send({ t: 'deck', d: 'A' }); buzz(); });
  $('dB').addEventListener('click', () => { send({ t: 'deck', d: 'B' }); buzz(); });
  $('go').addEventListener('click', () => { send({ t: 'go' }); buzz(); });
  $('black').addEventListener('click', () => { send({ t: 'black' }); buzz(); });
  $('tap').addEventListener('pointerdown', () => { send({ t: 'tap' }); buzz(); });
  $('random').addEventListener('click', () => { send({ t: 'random' }); buzz(); toast('🎲 nuevo patch al aire'); });
  $('vary').addEventListener('click', () => { send({ t: 'vary' }); buzz(); });
  $('ovl').addEventListener('click', () => { send({ t: 'overlay' }); buzz(); });
  $('prev').addEventListener('click', () => { send({ t: 'step', d: -1 }); buzz(); });
  $('next').addEventListener('click', () => { send({ t: 'step', d: 1 }); buzz(); });
  $('pg0').addEventListener('click', () => { page = 0; if (state) renderScenes(); });
  $('pg1').addEventListener('click', () => { page = 1; if (state) renderScenes(); });
  const st = $('strobe');
  st.addEventListener('pointerdown', e => { st.setPointerCapture(e.pointerId); st.classList.add('on'); send({ t: 'strobe', on: true }); });
  const stOff = () => { if (st.classList.contains('on')) { st.classList.remove('on'); send({ t: 'strobe', on: false }); } };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => st.addEventListener(t, stOff));
  st.addEventListener('contextmenu', e => e.preventDefault());

  // 👁 live video of what is on air
  $('eye').addEventListener('click', () => {
    videoOn = !videoOn;
    $('eye').classList.toggle('on', videoOn);
    $('videoBox').hidden = !videoOn;
    if (conn && conn.open) conn.send({ t: 'video', on: videoOn });
    if (!videoOn) $('video').srcObject = null;
  });

  // 🔒 lock: one tap locks, unlocking needs a long press (no accidents on stage)
  let locked = false, lockHold = null;
  const lk = $('lock');
  function setLock(on) { locked = on; document.body.classList.toggle('locked', on); lk.classList.toggle('on', on); lk.textContent = on ? '🔒' : '🔓'; buzz(on ? 30 : 60); }
  lk.addEventListener('pointerdown', () => {
    if (!locked) { setLock(true); toast('Bloqueado · mantené 🔒 para desbloquear'); return; }
    lockHold = setTimeout(() => { setLock(false); toast('Desbloqueado'); }, 800);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => lk.addEventListener(t, () => clearTimeout(lockHold)));
  $('lockLayer').addEventListener('pointerdown', () => toast('Bloqueado · mantené 🔒 para desbloquear'));

  addEventListener('resize', () => { if (state) state.controls.forEach((_, i) => paintCtl(i)); });
  function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms || 12); wake(); }
  // keep the phone screen on while it is used as a controller
  let wl = null;
  async function wake() { try { if (!wl && navigator.wakeLock) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) { /* not allowed */ } }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { wake(); if (!conn || !conn.open) connect(); } });

  connect();
  window.__remote = { get state() { return state; }, send, show(s) { state = s; render(); } };
})();
</script>
</body>
</html>
