<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Salida — PUDRUS Lab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { position: absolute; inset: 0; display: block; width: 100vw; height: 100vh; }
    body.idle { cursor: none; }
    .hint { position: fixed; left: 50%; bottom: 20px; z-index: 5; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px;
            background: rgba(0,0,0,0.7); color: #ccc; font: 13px ui-monospace, Menlo, Consolas, monospace; transition: opacity .4s; }
    body.idle .hint { opacity: 0; }
  </style>
</head>
<body>
<div id="stage"></div>
<div class="hint" id="hint">Doble clic: pantalla completa · esperando al editor…</div>
<script src="nodes.js"></script>
<script>
(function () {
  // Shows what is ON AIR in the editor (not the preview), with the same cross-fades.
  const N = window.PudrusNodes;
  const stage = N.createStage(document.getElementById('stage'));
  let time = 0, audio = [0, 0, 0, 0], playing = true, lastMsg = 0;
  const ch = new BroadcastChannel('pudrus-nodes');

  function size() { stage.resize(Math.min(3840, innerWidth * devicePixelRatio), Math.min(2160, innerHeight * devicePixelRatio)); }
  size(); addEventListener('resize', size);

  ch.onmessage = e => {
    const m = e.data || {};
    lastMsg = performance.now();
    try {
      if (m.type === 'live') { stage.go(m.graph, m.fade || 0); document.getElementById('hint').textContent = 'Doble clic: pantalla completa'; }
      else if (m.type === 'direct') stage.direct(m.graph);
      else if (m.type === 'frame') { time = m.t; audio = m.audio; }
      else if (m.type === 'play') playing = m.playing;
    } catch (err) { /* keep the last good shader */ }
  };
  ch.postMessage({ type: 'hello' });

  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    // keep running smoothly between editor messages (e.g. when the editor tab is in the background)
    if (playing && now - lastMsg > 100) time += Math.min(0.1, (now - last) / 1000);
    last = now;
    stage.render(time, audio);
  }
  requestAnimationFrame(loop);

  addEventListener('dblclick', () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); });
  let idle;
  addEventListener('pointermove', () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 2000); });
  idle = setTimeout(() => document.body.classList.add('idle'), 4000);
})();
</script>
</body>
</html>
