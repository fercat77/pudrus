<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <title>Halftone — PUDRUS.XYZ</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/tool-shell.css">
</head>
<body>

<nav>
  <a href="../../index.html" class="nav-logo">PUDRUS<span>.xyz</span></a>
  <ul class="nav-links">
    <li><a href="../../index.html#tools" data-i18n="nav.tools">Tools</a></li>
  </ul>
  <div class="nav-lang">
    <select id="langSelect" aria-label="Language selector">
      <option value="es">ES</option>
      <option value="en">EN</option>
    </select>
  </div>
</nav>

<main id="tool"></main>

<script src="../../js/i18n.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/tool-shell.js"></script>
<script>
(function () {
  // Channels per mode: how to read the "ink amount" (0..1) from r,g,b and how to print it
  const MODES = {
    mono: p => [{ angle: p.angle, color: p.ink, amount: (r, g, b) => 1 - (0.299 * r + 0.587 * g + 0.114 * b) / 255 }],
    cmyk: () => {
      const k = (r, g, b) => 1 - Math.max(r, g, b) / 255;
      const ch = i => (r, g, b) => { const K = k(r, g, b); return K >= 1 ? 0 : (1 - [r, g, b][i] / 255 - K) / (1 - K); };
      return [
        { angle: 15, color: '#00aeef', amount: ch(0) },
        { angle: 75, color: '#ec008c', amount: ch(1) },
        { angle: 0,  color: '#fff200', amount: ch(2) },
        { angle: 45, color: '#111111', amount: k },
      ];
    },
    rgb: () => [
      { angle: 15, color: '#ff2a2a', amount: r => r / 255 },
      { angle: 45, color: '#2aff2a', amount: (r, g) => g / 255 },
      { angle: 75, color: '#2a5bff', amount: (r, g, b) => b / 255 },
    ],
  };

  function draw({ ctx, srcCanvas, W, H, p, k }) {
    const cell = Math.max(2, p.cell * k);
    // Averaged colour per small block, sampled while walking the rotated grid
    const sw = Math.max(1, Math.round(W / (cell / 2))), sh = Math.max(1, Math.round(H / (cell / 2)));
    const small = document.createElement('canvas');
    small.width = sw; small.height = sh;
    const sctx = small.getContext('2d', { willReadFrequently: true });
    sctx.imageSmoothingQuality = 'high';
    sctx.drawImage(srcCanvas, 0, 0, sw, sh);
    const d = sctx.getImageData(0, 0, sw, sh).data;
    const cf = (259 * (p.contrast + 255)) / (255 * (259 - p.contrast));
    const adj = v => Math.max(0, Math.min(255, cf * (v - 128) + 128));

    const rgbMode = p.mode === 'rgb';
    ctx.fillStyle = rgbMode ? '#000000' : p.paper;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = rgbMode ? 'screen' : 'multiply';

    const R = Math.hypot(W, H) / 2, cx = W / 2, cy = H / 2;
    for (const ch of MODES[p.mode](p)) {
      const a = ch.angle * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
      ctx.fillStyle = ch.color;
      ctx.beginPath();
      for (let v = -R; v <= R; v += cell) {
        for (let u = -R; u <= R; u += cell) {
          const x = cx + u * ca - v * sa, y = cy + u * sa + v * ca;
          if (x < -cell || y < -cell || x > W + cell || y > H + cell) continue;
          const si = (Math.min(sh - 1, Math.max(0, (y / H * sh) | 0)) * sw + Math.min(sw - 1, Math.max(0, (x / W * sw) | 0))) * 4;
          let amt = ch.amount(adj(d[si]), adj(d[si + 1]), adj(d[si + 2]));
          if (p.invert) amt = 1 - amt;
          if (amt <= 0.02) continue;
          // area proportional to ink amount
          const r = (cell / 2) * Math.sqrt(amt) * 1.42 * (p.gain / 100);
          shape(ctx, p.shape, x, y, r, ca, sa);
        }
      }
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function shape(ctx, kind, x, y, r, ca, sa) {
    if (kind === 'circle') { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); return; }
    let pts;
    if (kind === 'square') { const s = r * 0.886; pts = [[-s, -s], [s, -s], [s, s], [-s, s]]; }
    else if (kind === 'diamond') pts = [[0, -r * 1.2], [r * 1.2, 0], [0, r * 1.2], [-r * 1.2, 0]];
    else pts = [[-r * 1.6, -r * 0.5], [r * 1.6, -r * 0.5], [r * 1.6, r * 0.5], [-r * 1.6, r * 0.5]]; // line
    pts.forEach(([u, v], i) => {
      const px = x + u * ca - v * sa, py = y + u * sa + v * ca;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    });
    ctx.closePath();
  }

  const mono = p => p.mode === 'mono';
  PudrusTool.create({
    id: 'halftone', i18n: 'halftone', icon: '◉',
    name: '◉ Halftone', desc: 'Print-style dot screens: mono, CMYK or RGB.',
    controls: [
      { key: 'mode', label: 'halftone.mode', fallback: 'Mode', type: 'select', value: 'mono', options: [
        { value: 'mono', label: 'halftone.modeMono', fallback: 'One ink' },
        { value: 'cmyk', label: 'halftone.modeCmyk', fallback: 'CMYK' },
        { value: 'rgb', label: 'halftone.modeRgb', fallback: 'RGB (light)' } ] },
      { key: 'cell', label: 'halftone.cell', fallback: 'Dot size', min: 3, max: 40, value: 10, rand: [5, 25] },
      { key: 'shape', label: 'halftone.shape', fallback: 'Shape', type: 'select', value: 'circle', options: [
        { value: 'circle', label: 'halftone.shapeCircle', fallback: 'Circle' },
        { value: 'square', label: 'halftone.shapeSquare', fallback: 'Square' },
        { value: 'diamond', label: 'halftone.shapeDiamond', fallback: 'Diamond' },
        { value: 'line', label: 'halftone.shapeLine', fallback: 'Line' } ] },
      { key: 'angle', label: 'halftone.angle', fallback: 'Screen angle', min: 0, max: 90, value: 45, unit: '°', show: mono },
      { key: 'ink', label: 'halftone.ink', fallback: 'Ink', type: 'color', value: '#111111', show: mono },
      { key: 'paper', label: 'halftone.paper', fallback: 'Paper', type: 'color', value: '#f4f0e6', show: p => p.mode !== 'rgb' },
      { key: 'gain', label: 'halftone.gain', fallback: 'Dot gain', min: 50, max: 150, value: 100, unit: '%', advanced: true, rand: [80, 120] },
      { key: 'contrast', label: 'halftone.contrast', fallback: 'Contrast', min: -100, max: 100, value: 10, advanced: true, rand: [0, 40] },
      { key: 'invert', label: 'halftone.invert', fallback: 'Invert', type: 'toggle', value: false, advanced: true, randChance: 0.1 },
    ],
    presets: [
      { label: 'halftone.presetNewspaper', fallback: 'Newspaper', values: { mode: 'mono', cell: 8, angle: 45, ink: '#1a1a1a', paper: '#e9e4d8', contrast: 25 } },
      { label: 'halftone.presetComic', fallback: 'Comic', values: { mode: 'cmyk', cell: 14, paper: '#fffbea', contrast: 30 } },
      { label: 'halftone.presetRiso', fallback: 'Riso', values: { mode: 'mono', cell: 11, angle: 15, ink: '#ff3d7f', paper: '#fff4e6', gain: 115 } },
      { label: 'halftone.presetLines', fallback: 'Lines', values: { mode: 'mono', cell: 9, angle: 30, shape: 'line', ink: '#0b1f4d', paper: '#f4f0e6' } },
    ],
    draw,
  });
})();
</script>
</body>
</html>
