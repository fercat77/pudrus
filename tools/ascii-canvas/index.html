<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <title>ASCII Canvas — PUDRUS.XYZ</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../../css/tool-shell.css">
</head>
<body>

<nav>
  <a href="../../index.html" class="nav-logo">PUDRUS<span>.xyz</span></a>
  <ul class="nav-links">
    <li><a href="../../index.html#tools" data-i18n="nav.tools">Tools</a></li>
  </ul>
  <div class="nav-lang">
    <select id="langSelect" aria-label="Language selector">
      <option value="es">ES</option>
      <option value="en">EN</option>
    </select>
  </div>
</nav>

<main id="tool"></main>

<script src="../../js/i18n.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/tool-shell.js"></script>
<script>
(function () {
  // Character sets from dense to light
  const SETS = {
    standard: '@%#*+=-:. ',
    detailed: '$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,"^`\'. ',
    blocks: '█▓▒░ ',
    minimal: '#=:. ',
    binary: '10 ',
  };
  const TINTS = { green: [102, 255, 51], white: [235, 235, 235], amber: [255, 176, 0], cyan: [0, 212, 255] };
  const CHAR_ASPECT = 0.6;  // monospace glyph width / height

  function draw({ ctx, srcCanvas, W, H, p }) {
    const chars = p.charset === 'custom' ? (p.custom || ' ') : SETS[p.charset];
    const n = chars.length;
    const cellW = W / p.cols;
    const cellH = cellW / CHAR_ASPECT * (p.lineHeight / 100);
    const rows = Math.max(1, Math.floor(H / cellH));
    const cols = Math.max(1, Math.round(p.cols));

    const s = document.createElement('canvas');
    s.width = cols; s.height = rows;
    const sctx = s.getContext('2d', { willReadFrequently: true });
    sctx.imageSmoothingQuality = 'high';
    sctx.drawImage(srcCanvas, 0, 0, cols, rows);
    const d = sctx.getImageData(0, 0, cols, rows).data;

    const paper = p.paper;
    ctx.fillStyle = paper ? '#f4f0e6' : '#050508';
    ctx.fillRect(0, 0, W, H);
    const fontSize = cellW / CHAR_ASPECT;
    ctx.font = `${fontSize}px "Courier New", ui-monospace, monospace`;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    const cf = (259 * (p.contrast + 255)) / (255 * (259 - p.contrast));
    const tint = TINTS[p.color];
    if (tint) ctx.fillStyle = paper ? '#111111' : `rgb(${tint})`;
    const offY = (H - rows * cellH) / 2;

    for (let y = 0; y < rows; y++) {
      let line = '';
      for (let x = 0; x < cols; x++) {
        const i = (y * cols + x) * 4;
        const r = d[i], g = d[i + 1], b = d[i + 2];
        let l = Math.max(0, Math.min(255, cf * (0.299 * r + 0.587 * g + 0.114 * b - 128) + 128 + p.brightness * 1.28)) / 255;
        // dark background: bright pixel -> dense char; paper: dark pixel -> dense char
        const t = paper ? l : 1 - l;
        const ch = chars[Math.min(n - 1, Math.floor(t * n))];
        if (tint) { line += ch; continue; }
        if (ch === ' ') continue;
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillText(ch, x * cellW, offY + y * cellH);
      }
      // Single-colour modes keep one fillStyle for everything (no per-char style changes)
      if (tint) for (let x = 0; x < line.length; x++) if (line[x] !== ' ') ctx.fillText(line[x], x * cellW, offY + y * cellH);
    }
  }

  PudrusTool.create({
    id: 'ascii-canvas', i18n: 'ascii', icon: '◊',
    name: '◊ ASCII Canvas', desc: 'Turn images into ASCII art.',
    controls: [
      { key: 'cols', label: 'ascii.cols', fallback: 'Characters per row', min: 20, max: 300, step: 2, value: 110, rand: [50, 200] },
      { key: 'charset', label: 'ascii.charset', fallback: 'Characters', type: 'select', value: 'standard', options: [
        { value: 'standard', label: 'ascii.setStandard', fallback: 'Standard' },
        { value: 'detailed', label: 'ascii.setDetailed', fallback: 'Detailed' },
        { value: 'blocks', label: 'ascii.setBlocks', fallback: 'Blocks' },
        { value: 'minimal', label: 'ascii.setMinimal', fallback: 'Minimal' },
        { value: 'binary', label: 'ascii.setBinary', fallback: 'Binary' },
        { value: 'custom', label: 'ascii.setCustom', fallback: 'Custom' } ] },
      { key: 'custom', label: 'ascii.custom', fallback: 'Your characters (dense → light)', type: 'text', value: 'PUDRUS. ', show: p => p.charset === 'custom' },
      { key: 'color', label: 'ascii.color', fallback: 'Color', type: 'select', value: 'green', options: [
        { value: 'green', label: 'ascii.colorGreen', fallback: 'Terminal green' },
        { value: 'original', label: 'ascii.colorOriginal', fallback: 'Image colors' },
        { value: 'white', label: 'ascii.colorWhite', fallback: 'White' },
        { value: 'amber', label: 'ascii.colorAmber', fallback: 'Amber' },
        { value: 'cyan', label: 'ascii.colorCyan', fallback: 'Cyan' } ] },
      { key: 'contrast', label: 'ascii.contrast', fallback: 'Contrast', min: -100, max: 100, value: 20, rand: [0, 60] },
      { key: 'brightness', label: 'ascii.brightness', fallback: 'Brightness', min: -100, max: 100, value: 0, advanced: true, rand: [-20, 20] },
      { key: 'lineHeight', label: 'ascii.lineHeight', fallback: 'Line height', min: 70, max: 160, value: 100, unit: '%', advanced: true, rand: false },
      { key: 'paper', label: 'ascii.paper', fallback: 'Light background', type: 'toggle', value: false, advanced: true, randChance: 0.2 },
    ],
    presets: [
      { label: 'ascii.presetTerminal', fallback: 'Terminal', values: { cols: 120, charset: 'standard', color: 'green', contrast: 30 } },
      { label: 'ascii.presetColor', fallback: 'Color', values: { cols: 150, charset: 'detailed', color: 'original', contrast: 20 } },
      { label: 'ascii.presetBlocks', fallback: 'Blocks', values: { cols: 80, charset: 'blocks', color: 'amber', contrast: 25 } },
      { label: 'ascii.presetPrint', fallback: 'Typewriter', values: { cols: 140, charset: 'detailed', color: 'white', paper: true, contrast: 30 } },
    ],
    draw,
  });
})();
</script>
</body>
</html>
