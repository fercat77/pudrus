<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <title>Constellation — PUDRUS.XYZ</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/tool-shell.css">
</head>
<body>

<nav>
  <a href="../../index.html" class="nav-logo">PUDRUS<span>.xyz</span></a>
  <ul class="nav-links">
    <li><a href="../../index.html#tools" data-i18n="nav.tools">Tools</a></li>
  </ul>
  <div class="nav-lang">
    <select id="langSelect" aria-label="Language selector">
      <option value="es">ES</option>
      <option value="en">EN</option>
    </select>
  </div>
</nav>

<main id="tool"></main>

<script src="../../js/i18n.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/tool-shell.js"></script>
<script>
(function () {
  const GRID = 40; // brightness analysis grid

  // Star positions in 0..1 coordinates: brightest spots of the image first, then random fill
  function stars(srcCanvas, p, rng) {
    const c = document.createElement('canvas');
    c.width = GRID; c.height = GRID;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(srcCanvas, 0, 0, GRID, GRID);
    const d = x.getImageData(0, 0, GRID, GRID).data;
    const cells = [];
    for (let i = 0; i < GRID * GRID; i++) cells.push({ i, l: 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2] });
    cells.sort((a, b) => b.l - a.l);
    const out = [];
    const fromImage = p.mode === 'starfield' ? Math.round(p.count * 0.4) : Math.round(p.count * 0.75);
    for (let q = 0; q < p.count; q++) {
      let sx, sy, l;
      if (q < fromImage && q < cells.length) {
        const cell = cells[(q * 3) % Math.min(cells.length, p.count * 3)];
        sx = ((cell.i % GRID) + rng()) / GRID; sy = (((cell.i / GRID) | 0) + rng()) / GRID; l = cell.l / 255;
      } else { sx = rng(); sy = rng(); l = 0.4 + rng() * 0.6; }
      out.push({ x: sx, y: sy, s: 0.6 + rng() * 0.9, a: 0.45 + l * 0.55 });
    }
    return out;
  }

  function links(pts, W, H, p) {
    const res = [];
    const maxD = Math.min(W, H) * (p.mode === 'network' ? 0.28 : 0.2);
    const per = p.mode === 'network' ? p.links + 1 : p.links;
    const seen = new Set();
    for (let i = 0; i < pts.length; i++) {
      const near = [];
      for (let j = 0; j < pts.length; j++) {
        if (i === j) continue;
        const dx = (pts[j].x - pts[i].x) * W, dy = (pts[j].y - pts[i].y) * H, dd = dx * dx + dy * dy;
        if (dd < maxD * maxD) near.push([dd, j]);
      }
      near.sort((a, b) => a[0] - b[0]);
      for (const [, j] of near.slice(0, per)) {
        const key = i < j ? i + '-' + j : j + '-' + i;
        if (!seen.has(key)) { seen.add(key); res.push([pts[i], pts[j]]); }
      }
    }
    return res;
  }

  function draw({ ctx, srcCanvas, W, H, p, rng, k }) {
    ctx.drawImage(srcCanvas, 0, 0, W, H);
    if (p.dim > 0) { ctx.fillStyle = `rgba(0,0,0,${p.dim / 100})`; ctx.fillRect(0, 0, W, H); }
    const pts = stars(srcCanvas, p, rng);
    const col = p.color;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.shadowColor = col;

    if (p.mode === 'map') {
      ctx.globalAlpha = p.lines / 100;
      ctx.lineWidth = 1 * k;
      ctx.setLineDash([8 * k, 8 * k]);
      ctx.beginPath();
      const step = Math.min(W, H) / 6;
      for (let x = W / 2 % step; x < W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
      for (let y = H / 2 % step; y < H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(W / 2, H / 2, Math.min(W, H) * 0.3, 0, Math.PI * 2);
      ctx.moveTo(W / 2 + Math.min(W, H) * 0.15, H / 2);
      ctx.arc(W / 2, H / 2, Math.min(W, H) * 0.15, 0, Math.PI * 2);
      ctx.stroke();
    } else if (p.mode !== 'starfield' && p.lines > 0) {
      ctx.globalAlpha = p.lines / 100;
      ctx.lineWidth = 1.2 * k;
      ctx.shadowBlur = p.glow * k * 0.5;
      ctx.beginPath();
      for (const [a, b] of links(pts, W, H, p)) { ctx.moveTo(a.x * W, a.y * H); ctx.lineTo(b.x * W, b.y * H); }
      ctx.stroke();
    }

    ctx.shadowBlur = p.glow * k;
    for (const s of pts) {
      const x = s.x * W, y = s.y * H, r = p.size * s.s * k;
      ctx.globalAlpha = s.a;
      ctx.lineWidth = 1.5 * k;
      ctx.beginPath();
      if (p.shape === 'circle') ctx.arc(x, y, r, 0, Math.PI * 2);
      else if (p.shape === 'square') ctx.rect(x - r, y - r, r * 2, r * 2);
      else if (p.shape === 'cross') { ctx.moveTo(x - r * 1.6, y); ctx.lineTo(x + r * 1.6, y); ctx.moveTo(x, y - r * 1.6); ctx.lineTo(x, y + r * 1.6); }
      else { ctx.arc(x, y, r * 0.6, 0, Math.PI * 2); ctx.fill(); }
      ctx.stroke();
      if (p.ring) {
        ctx.globalAlpha = s.a * 0.35;
        ctx.lineWidth = 1 * k;
        ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, Math.PI * 2); ctx.stroke();
      }
    }
    if (p.labels) {
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.8;
      ctx.font = `${10 * k}px "Courier New", monospace`;
      pts.forEach((s, i) => {
        if (i % 4) return;
        ctx.fillText(`${(s.x * 180 - 90).toFixed(1)}° ${(s.y * 360 - 180).toFixed(1)}°`, s.x * W + p.size * k * 2, s.y * H - p.size * k * 1.5);
      });
    }
    ctx.restore();
  }

  const linked = p => p.mode !== 'starfield';
  PudrusTool.create({
    id: 'constellation', i18n: 'constellation', icon: '✧',
    name: '✧ Constellation', desc: 'Generative star maps and node networks over your images.',
    controls: [
      { key: 'mode', label: 'constellation.mode', fallback: 'Mode', type: 'select', value: 'constellation', options: [
        { value: 'constellation', label: 'constellation.modeConstellation', fallback: 'Constellation' },
        { value: 'network', label: 'constellation.modeNetwork', fallback: 'Network' },
        { value: 'starfield', label: 'constellation.modeStarfield', fallback: 'Starfield' },
        { value: 'map', label: 'constellation.modeMap', fallback: 'Technical map' } ] },
      { key: 'count', label: 'constellation.count', fallback: 'Stars', min: 10, max: 200, value: 60, rand: [20, 140] },
      { key: 'size', label: 'constellation.size', fallback: 'Star size', min: 1, max: 20, value: 5, rand: [2, 12] },
      { key: 'lines', label: 'constellation.lines', fallback: 'Line opacity', min: 0, max: 100, value: 50, unit: '%', show: linked, rand: [20, 80] },
      { key: 'color', label: 'constellation.color', fallback: 'Color', type: 'color', value: '#66ff33', rand: true },
      { key: 'glow', label: 'constellation.glow', fallback: 'Glow', min: 0, max: 50, value: 12, advanced: true, rand: [0, 30] },
      { key: 'links', label: 'constellation.links', fallback: 'Links per star', min: 1, max: 5, value: 2, advanced: true, show: p => p.mode === 'constellation' || p.mode === 'network', rand: [1, 4] },
      { key: 'shape', label: 'constellation.shape', fallback: 'Star shape', type: 'select', value: 'circle', advanced: true, options: [
        { value: 'circle', label: 'constellation.shapeCircle', fallback: 'Circle' },
        { value: 'dot', label: 'constellation.shapeDot', fallback: 'Dot' },
        { value: 'square', label: 'constellation.shapeSquare', fallback: 'Square' },
        { value: 'cross', label: 'constellation.shapeCross', fallback: 'Cross' } ] },
      { key: 'dim', label: 'constellation.dim', fallback: 'Darken image', min: 0, max: 90, value: 25, unit: '%', advanced: true, rand: [0, 60] },
      { key: 'ring', label: 'constellation.ring', fallback: 'Outer rings', type: 'toggle', value: false, advanced: true, randChance: 0.4 },
      { key: 'labels', label: 'constellation.labels', fallback: 'Coordinates', type: 'toggle', value: false, advanced: true, randChance: 0.3 },
    ],
    presets: [
      { label: 'constellation.presetSky', fallback: 'Night sky', values: { mode: 'constellation', count: 70, size: 4, color: '#d0efff', glow: 18, dim: 40 } },
      { label: 'constellation.presetNetwork', fallback: 'Network', values: { mode: 'network', count: 110, size: 3, lines: 40, color: '#66ff33', shape: 'dot', links: 3 } },
      { label: 'constellation.presetHud', fallback: 'HUD', values: { mode: 'map', count: 40, size: 6, lines: 45, color: '#00d4ff', shape: 'cross', labels: true, ring: true, dim: 35 } },
      { label: 'constellation.presetDust', fallback: 'Stardust', values: { mode: 'starfield', count: 180, size: 2, color: '#fff2c4', glow: 25, shape: 'dot' } },
    ],
    draw,
  });
})();
</script>
</body>
</html>
