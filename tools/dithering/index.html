<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <title>Dithering — PUDRUS.XYZ</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/tool-shell.css">
</head>
<body>

<nav>
  <a href="../../index.html" class="nav-logo">PUDRUS<span>.xyz</span></a>
  <ul class="nav-links">
    <li><a href="../../index.html#tools" data-i18n="nav.tools">Tools</a></li>
  </ul>
  <div class="nav-lang">
    <select id="langSelect" aria-label="Language selector">
      <option value="es">ES</option>
      <option value="en">EN</option>
    </select>
  </div>
</nav>

<main id="tool"></main>

<script src="../../js/i18n.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/tool-shell.js"></script>
<script>
(function () {
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const PALETTES = {
    bw:      ['#000000', '#ffffff'],
    gray:    ['#000000', '#555555', '#aaaaaa', '#ffffff'],
    gameboy: ['#0f380f', '#306230', '#8bac0f', '#9bbc0f'],
    cga:     ['#000000', '#55ffff', '#ff55ff', '#ffffff'],
    pudrus:  ['#050508', '#00662c', '#66ff33', '#d0efff'],
    sepia:   ['#2b1d0e', '#6b4a2b', '#b08a5a', '#f1e3c8'],
  };
  // 8x8 Bayer matrix, normalised to -0.5..0.5
  const BAYER = (() => {
    const m = [[0, 2], [3, 1]];
    let b = m;
    for (let n = 2; n < 8; n *= 2) {
      const nb = [];
      for (let y = 0; y < n * 2; y++) { nb.push([]); for (let x = 0; x < n * 2; x++) nb[y].push(4 * b[y % n][x % n] + m[(y / n) | 0][(x / n) | 0]); }
      b = nb;
    }
    return b.map(r => r.map(v => v / 64 - 0.5));
  })();

  function draw({ ctx, srcCanvas, W, H, p, rng, k }) {
    // Work at "pixel size" resolution, then scale up with hard edges
    const ps = Math.max(1, Math.round(p.pixel * k));
    const w = Math.max(1, Math.round(W / ps)), h = Math.max(1, Math.round(H / ps));
    const small = document.createElement('canvas');
    small.width = w; small.height = h;
    const sctx = small.getContext('2d', { willReadFrequently: true });
    sctx.imageSmoothingQuality = 'high';
    sctx.drawImage(srcCanvas, 0, 0, w, h);
    const img = sctx.getImageData(0, 0, w, h);
    const d = img.data;

    const pal = (p.palette === 'custom' ? [p.c1, p.c2, p.c3, p.c4] : PALETTES[p.palette]).map(hex);
    const cf = (259 * (p.contrast + 255)) / (255 * (259 - p.contrast));
    const bri = p.brightness * 1.28;

    // Float buffer so diffused error is not clipped early
    const buf = new Float32Array(w * h * 3);
    for (let i = 0, j = 0; i < d.length; i += 4, j += 3) {
      let r = d[i], g = d[i + 1], b = d[i + 2];
      if (p.gray) r = g = b = 0.299 * r + 0.587 * g + 0.114 * b;
      r = cf * (r - 128) + 128 + bri; g = cf * (g - 128) + 128 + bri; b = cf * (b - 128) + 128 + bri;
      if (p.invert) { r = 255 - r; g = 255 - g; b = 255 - b; }
      buf[j] = r; buf[j + 1] = g; buf[j + 2] = b;
    }

    const nearest = (r, g, b) => {
      let best = 0, bd = Infinity;
      for (let c = 0; c < pal.length; c++) {
        const dr = r - pal[c][0], dg = g - pal[c][1], db = b - pal[c][2];
        const dist = dr * dr * 0.3 + dg * dg * 0.59 + db * db * 0.11;
        if (dist < bd) { bd = dist; best = c; }
      }
      return pal[best];
    };
    const spread = p.algorithm === 'atkinson'
      ? [[1, 0, 1 / 8], [2, 0, 1 / 8], [-1, 1, 1 / 8], [0, 1, 1 / 8], [1, 1, 1 / 8], [0, 2, 1 / 8]]
      : [[1, 0, 7 / 16], [-1, 1, 3 / 16], [0, 1, 5 / 16], [1, 1, 1 / 16]];
    const amp = 255 / Math.max(1, pal.length - 1);

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const j = (y * w + x) * 3, i = (y * w + x) * 4;
        let r = buf[j], g = buf[j + 1], b = buf[j + 2];
        if (p.algorithm === 'bayer') { const o = BAYER[y & 7][x & 7] * amp; r += o; g += o; b += o; }
        else if (p.algorithm === 'noise') { const o = (rng() - 0.5) * amp * 1.2; r += o; g += o; b += o; }
        const c = nearest(r, g, b);
        d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
        if (p.algorithm === 'floyd' || p.algorithm === 'atkinson') {
          const er = r - c[0], eg = g - c[1], eb = b - c[2];
          for (const [dx, dy, wgt] of spread) {
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || nx >= w || ny >= h) continue;
            const n = (ny * w + nx) * 3;
            buf[n] += er * wgt; buf[n + 1] += eg * wgt; buf[n + 2] += eb * wgt;
          }
        }
      }
    }
    sctx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, W, H);
  }

  const custom = p => p.palette === 'custom';
  PudrusTool.create({
    id: 'dithering', i18n: 'dithering', icon: '⠿',
    name: '⠿ Dithering', desc: 'Classic dithering with retro palettes.',
    controls: [
      { key: 'algorithm', label: 'dithering.algorithm', fallback: 'Algorithm', type: 'select', value: 'floyd', options: [
        { value: 'floyd', label: 'dithering.algoFloyd', fallback: 'Floyd–Steinberg' },
        { value: 'atkinson', label: 'dithering.algoAtkinson', fallback: 'Atkinson' },
        { value: 'bayer', label: 'dithering.algoBayer', fallback: 'Ordered (Bayer)' },
        { value: 'noise', label: 'dithering.algoNoise', fallback: 'Noise' } ] },
      { key: 'palette', label: 'dithering.palette', fallback: 'Palette', type: 'select', value: 'bw', options: [
        { value: 'bw', label: 'dithering.palBw', fallback: '1-bit (B&W)' },
        { value: 'gray', label: 'dithering.palGray', fallback: '4 grays' },
        { value: 'gameboy', label: 'dithering.palGameboy', fallback: 'Game Boy' },
        { value: 'cga', label: 'dithering.palCga', fallback: 'CGA' },
        { value: 'pudrus', label: 'dithering.palPudrus', fallback: 'PUDRUS' },
        { value: 'sepia', label: 'dithering.palSepia', fallback: 'Sepia' },
        { value: 'custom', label: 'dithering.palCustom', fallback: 'Custom' } ] },
      { key: 'c1', label: 'dithering.color1', fallback: 'Color 1', type: 'color', value: '#050508', show: custom },
      { key: 'c2', label: 'dithering.color2', fallback: 'Color 2', type: 'color', value: '#ff4ecc', show: custom },
      { key: 'c3', label: 'dithering.color3', fallback: 'Color 3', type: 'color', value: '#00d4ff', show: custom },
      { key: 'c4', label: 'dithering.color4', fallback: 'Color 4', type: 'color', value: '#ffffff', show: custom },
      { key: 'pixel', label: 'dithering.pixel', fallback: 'Pixel size', min: 1, max: 12, value: 2, rand: [1, 6] },
      { key: 'contrast', label: 'dithering.contrast', fallback: 'Contrast', min: -100, max: 100, value: 0, rand: [-20, 50] },
      { key: 'brightness', label: 'dithering.brightness', fallback: 'Brightness', min: -100, max: 100, value: 0, advanced: true, rand: [-20, 20] },
      { key: 'gray', label: 'dithering.gray', fallback: 'Grayscale first', type: 'toggle', value: true, advanced: true, randChance: 0.7 },
      { key: 'invert', label: 'dithering.invert', fallback: 'Invert', type: 'toggle', value: false, advanced: true, randChance: 0.1 },
    ],
    presets: [
      { label: 'dithering.presetGameboy', fallback: 'Game Boy', values: { palette: 'gameboy', algorithm: 'bayer', pixel: 3, contrast: 20 } },
      { label: 'dithering.preset1bit', fallback: '1-bit', values: { palette: 'bw', algorithm: 'atkinson', pixel: 2, contrast: 30 } },
      { label: 'dithering.presetCga', fallback: 'CGA', values: { palette: 'cga', algorithm: 'floyd', pixel: 3, gray: false } },
      { label: 'dithering.presetPrint', fallback: 'Print', values: { palette: 'sepia', algorithm: 'noise', pixel: 1, contrast: 25 } },
    ],
    draw,
  });
})();
</script>
</body>
</html>
