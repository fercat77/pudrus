<script>
(function () {
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  // 3x3 colour matrix for brightness · hue-rotate · saturate (same maths as the CSS filters)
  function colorMatrix(bri, hueDeg, sat) {
    const a = hueDeg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    const H = [
      0.213 + c * 0.787 - s * 0.213, 0.715 - c * 0.715 - s * 0.715, 0.072 - c * 0.072 + s * 0.928,
      0.213 - c * 0.213 + s * 0.143, 0.715 + c * 0.285 + s * 0.140, 0.072 - c * 0.072 - s * 0.283,
      0.213 - c * 0.213 - s * 0.787, 0.715 - c * 0.715 + s * 0.715, 0.072 + c * 0.928 + s * 0.072,
    ];
    const S = [
      0.213 + 0.787 * sat, 0.715 - 0.715 * sat, 0.072 - 0.072 * sat,
      0.213 - 0.213 * sat, 0.715 + 0.285 * sat, 0.072 - 0.072 * sat,
      0.213 - 0.213 * sat, 0.715 - 0.715 * sat, 0.072 + 0.928 * sat,
    ];
    const M = new Float32Array(9);
    for (let r = 0; r < 3; r++)
      for (let k = 0; k < 3; k++)
        M[r * 3 + k] = bri * (H[r * 3] * S[k] + H[r * 3 + 1] * S[3 + k] + H[r * 3 + 2] * S[6 + k]);
    return M;
  }

  function render({ src, out, W, H, p, rng }) {
    const s = src.data, o = out.data;

    // 1) Row tearing: horizontal bands shifted sideways
    const rowOff = new Int32Array(H);
    if (p.rows > 0) {
      const amt = p.rows / 100;
      for (let y = 0; y < H;) {
        const band = Math.max(1, Math.round(H * (0.003 + rng() * 0.03)));
        const off = rng() < amt * 0.5 ? Math.round((rng() - 0.5) * 0.2 * W * amt) : 0;
        for (let i = 0; i < band && y < H; i++, y++) rowOff[y] = off;
      }
    }

    // 2) RGB split + colour, one pass over the pixels
    const dist = (p.rgb / 100) * 0.05 * W;
    const ang = p.angle * Math.PI / 180;
    const dx = Math.round(Math.cos(ang) * dist), dy = Math.round(Math.sin(ang) * dist);
    const useMatrix = p.hue !== 0 || p.saturation !== 100 || p.brightness !== 100;
    const M = colorMatrix(p.brightness / 100, p.hue, p.saturation / 100);
    const inv = p.invert;
    const W1 = W - 1, H1 = H - 1;

    for (let y = 0; y < H; y++) {
      const ro = rowOff[y];
      const rowR = clamp(y + dy, 0, H1) * W, rowG = y * W, rowB = clamp(y - dy, 0, H1) * W;
      let i = y * W * 4;
      for (let x = 0; x < W; x++, i += 4) {
        let r = s[(rowR + clamp(x + dx + ro, 0, W1)) * 4];
        let g = s[(rowG + clamp(x + ro, 0, W1)) * 4 + 1];
        let b = s[(rowB + clamp(x - dx + ro, 0, W1)) * 4 + 2];
        if (useMatrix) {
          const r2 = M[0] * r + M[1] * g + M[2] * b;
          const g2 = M[3] * r + M[4] * g + M[5] * b;
          b = M[6] * r + M[7] * g + M[8] * b;
          r = r2; g = g2;
        }
        if (inv) { r = 255 - r; g = 255 - g; b = 255 - b; }
        o[i] = r; o[i + 1] = g; o[i + 2] = b; o[i + 3] = 255;
      }
    }

    // 3) Block corruption: copy displaced rectangles (sometimes a single channel)
    const n = Math.round((p.blocks / 100) * 35);
    if (n > 0) {
      const snap = o.slice();
      const size = p.blockSize / 50, shift = p.blockShift / 100;
      for (let k = 0; k < n; k++) {
        const bw = Math.round(W * (0.05 + rng() * 0.35) * size);
        const bh = Math.max(1, Math.round(H * (0.004 + rng() * 0.04) * size));
        const bx = Math.round(rng() * W - bw / 2), by = Math.round(rng() * H);
        const off = Math.round((rng() - 0.5) * 2 * W * 0.15 * shift);
        const ch = rng() < 0.25 ? Math.floor(rng() * 3) : -1;
        for (let y = Math.max(0, by); y < Math.min(H, by + bh); y++) {
          for (let x = Math.max(0, bx); x < Math.min(W, bx + bw); x++) {
            const di = (y * W + x) * 4, si = (y * W + clamp(x + off, 0, W1)) * 4;
            if (ch < 0) { o[di] = snap[si]; o[di + 1] = snap[si + 1]; o[di + 2] = snap[si + 2]; }
            else o[di + ch] = snap[si + ch];
          }
        }
      }
    }

    // 4) Scanlines: darken thin rows at a spacing relative to the image height
    if (p.scan > 0) {
      const spacing = H / (80 + p.scanDensity * 6);
      const keep = 1 - p.scan / 100;
      for (let y = 0; y < H; y++) {
        if ((y / spacing) % 1 >= 0.4) continue;
        for (let i = y * W * 4, end = i + W * 4; i < end; i += 4) {
          o[i] *= keep; o[i + 1] *= keep; o[i + 2] *= keep;
        }
      }
    }
  }

  PudrusTool.create({
    id: 'glitch',
    i18n: 'glitch',
    icon: '▓',
    name: '▓ Glitch FX',
    desc: 'RGB shift, scanlines, block corruption and datamosh effects.',
    controls: [
      { key: 'rgb',        label: 'glitch.rgb',        fallback: 'RGB split',   min: 0, max: 100, value: 0,   unit: '%', rand: [10, 60] },
      { key: 'rows',       label: 'glitch.rows',       fallback: 'Tearing',     min: 0, max: 100, value: 0,   unit: '%', rand: [0, 60] },
      { key: 'blocks',     label: 'glitch.blocks',     fallback: 'Blocks',      min: 0, max: 100, value: 0,   unit: '%', rand: [0, 70] },
      { key: 'scan',       label: 'glitch.scan',       fallback: 'Scanlines',   min: 0, max: 100, value: 0,   unit: '%', rand: [0, 60] },
      { key: 'hue',        label: 'glitch.hue',        fallback: 'Hue',         min: 0, max: 360, value: 0,   unit: '°', rand: [0, 360] },
      { key: 'angle',      label: 'glitch.angle',      fallback: 'RGB angle',   min: 0, max: 360, value: 0,   unit: '°', advanced: true, rand: [0, 360] },
      { key: 'blockSize',  label: 'glitch.blockSize',  fallback: 'Block size',  min: 5, max: 100, value: 40,  advanced: true, rand: [15, 80] },
      { key: 'blockShift', label: 'glitch.blockShift', fallback: 'Block shift', min: 0, max: 100, value: 40,  unit: '%', advanced: true, rand: [10, 90] },
      { key: 'scanDensity',label: 'glitch.scanDensity',fallback: 'Scanline density', min: 1, max: 100, value: 40, advanced: true, rand: [10, 80] },
      { key: 'saturation', label: 'glitch.saturation', fallback: 'Saturation',  min: 0, max: 200, value: 100, unit: '%', advanced: true, rand: [80, 170] },
      { key: 'brightness', label: 'glitch.brightness', fallback: 'Brightness',  min: 50, max: 150, value: 100, unit: '%', advanced: true, rand: [90, 115] },
      { key: 'invert',     label: 'glitch.invert',     fallback: 'Invert', type: 'toggle', value: false, advanced: true, randChance: 0.1 },
    ],
    presets: [
      { label: 'glitch.presetSoft',    fallback: 'Soft',    values: { rgb: 15, scan: 20, scanDensity: 50 } },
      { label: 'glitch.presetVhs',     fallback: 'VHS',     values: { rgb: 35, rows: 30, scan: 45, scanDensity: 30, saturation: 130, blocks: 10, blockSize: 20 } },
      { label: 'glitch.presetBroken',  fallback: 'Broken',  values: { rgb: 50, rows: 55, blocks: 70, blockSize: 60, blockShift: 70 } },
      { label: 'glitch.presetAcid',    fallback: 'Acid',    values: { rgb: 40, hue: 200, saturation: 190, angle: 45, blocks: 25 } },
    ],
    render,
  });
})();
</script>
