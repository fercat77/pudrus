<script>
(function () {
  function render({ src, out, W, H, p, rng, k }) {
    const s = src.data, o = out.data;
    const curv = p.curvature / 100 * 0.35;
    const ab = p.aberration / 100 * 0.012;          // relative to half width
    const warp = p.warp / 100 * 0.01;
    const roll = p.roll / 100;
    const scan = p.scanlines / 100 * 0.7;
    const spacing = H / (120 + p.density * 5);       // scanline period in px
    const vig = p.vignette / 100;
    const noise = p.noise / 100 * 90;
    const glow = p.glow / 100;
    const mask = p.mask / 100 * 0.35;
    const maskW = Math.max(1, Math.round(k));        // phosphor stripe width
    const phase = rng() * Math.PI * 2;
    const W1 = W - 1, H1 = H - 1;
    const cornerR = 0.06 * (0.3 + curv * 2);         // rounded screen corners

    let i = 0;
    for (let y = 0; y < H; y++) {
      const ny = y / H * 2 - 1;
      const sl = 1 - scan * (0.5 + 0.5 * Math.cos(2 * Math.PI * y / spacing));
      for (let x = 0; x < W; x++, i += 4) {
        const nx = x / W * 2 - 1;
        // Barrel distortion: sample further out towards the edges
        const r2 = nx * nx + ny * ny;
        const f = 1 + r2 * curv;
        let sx = nx * f, sy = ny * f;
        // Outside the tube or in a rounded corner -> black
        const ex = Math.abs(sx), ey = Math.abs(sy);
        if (ex > 1 || ey > 1) { o[i] = o[i + 1] = o[i + 2] = 0; o[i + 3] = 255; continue; }
        if (ex > 1 - cornerR && ey > 1 - cornerR) {
          const cx = ex - (1 - cornerR), cy = ey - (1 - cornerR);
          if (cx * cx + cy * cy > cornerR * cornerR) { o[i] = o[i + 1] = o[i + 2] = 0; o[i + 3] = 255; continue; }
        }
        sx += Math.sin(sy * 30 + phase) * warp;
        let v = (sy + 1) / 2 + roll; v -= Math.floor(v);
        const u = (sx + 1) / 2;
        const py = Math.min(H1, (v * H) | 0) * W;
        const off = ab * sx * W;                       // more fringing near the edges
        let r = s[(py + Math.min(W1, Math.max(0, (u * W + off) | 0))) * 4];
        let g = s[(py + Math.min(W1, Math.max(0, (u * W) | 0))) * 4 + 1];
        let b = s[(py + Math.min(W1, Math.max(0, (u * W - off) | 0))) * 4 + 2];

        if (glow) {
          const l = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          const boost = 1 + glow * l * l * 0.8;
          r *= boost; g *= boost; b *= boost;
        }
        let m = sl;
        if (mask) {
          const col = ((x / maskW) | 0) % 3;
          r *= col === 0 ? 1 : 1 - mask; g *= col === 1 ? 1 : 1 - mask; b *= col === 2 ? 1 : 1 - mask;
        }
        if (vig) m *= 1 - vig * Math.pow(Math.min(1, (sx * sx + sy * sy) / 2), 1.5) * 1.6;
        if (noise) { const n = (rng() - 0.5) * noise; r += n; g += n; b += n; }
        o[i] = r * m; o[i + 1] = g * m; o[i + 2] = b * m; o[i + 3] = 255;
      }
    }
  }

  PudrusTool.create({
    id: 'crt-bend', i18n: 'crt', icon: '⏎',
    name: '⏎ CRT Bend', desc: 'Curved CRT screen, scanlines and signal distortion.',
    controls: [
      { key: 'curvature', label: 'crt.curvature', fallback: 'Curvature', min: 0, max: 100, value: 35, unit: '%', rand: [10, 70] },
      { key: 'scanlines', label: 'crt.scanlines', fallback: 'Scanlines', min: 0, max: 100, value: 40, unit: '%', rand: [10, 80] },
      { key: 'aberration', label: 'crt.aberration', fallback: 'Color fringing', min: 0, max: 100, value: 25, unit: '%', rand: [0, 70] },
      { key: 'noise', label: 'crt.noise', fallback: 'Noise', min: 0, max: 100, value: 15, unit: '%', rand: [0, 50] },
      { key: 'vignette', label: 'crt.vignette', fallback: 'Vignette', min: 0, max: 100, value: 40, unit: '%', rand: [10, 70] },
      { key: 'glow', label: 'crt.glow', fallback: 'Glow', min: 0, max: 100, value: 20, unit: '%', advanced: true, rand: [0, 60] },
      { key: 'mask', label: 'crt.mask', fallback: 'RGB phosphor mask', min: 0, max: 100, value: 0, unit: '%', advanced: true, rand: [0, 60] },
      { key: 'density', label: 'crt.density', fallback: 'Scanline density', min: 1, max: 100, value: 40, advanced: true, rand: [10, 80] },
      { key: 'warp', label: 'crt.warp', fallback: 'Line wobble', min: 0, max: 100, value: 0, unit: '%', advanced: true, rand: [0, 40] },
      { key: 'roll', label: 'crt.roll', fallback: 'V-sync roll', min: 0, max: 100, value: 0, unit: '%', advanced: true, rand: [0, 30] },
    ],
    presets: [
      { label: 'crt.presetTv', fallback: 'Old TV', values: { curvature: 55, scanlines: 55, aberration: 30, noise: 30, vignette: 60, glow: 25 } },
      { label: 'crt.presetArcade', fallback: 'Arcade', values: { curvature: 30, scanlines: 65, aberration: 15, noise: 5, vignette: 35, glow: 45, mask: 45 } },
      { label: 'crt.presetMonitor', fallback: 'Monitor', values: { curvature: 15, scanlines: 25, aberration: 10, noise: 5, vignette: 20, density: 70 } },
      { label: 'crt.presetBroken', fallback: 'Bad signal', values: { curvature: 45, scanlines: 50, aberration: 70, noise: 45, vignette: 50, warp: 45, roll: 18 } },
    ],
    render,
  });
})();
</script>
