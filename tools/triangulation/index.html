<script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/dist/d3-delaunay.min.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/tool-shell.js"></script>
<script>
(function () {
  // Edge map computed once per source image, at a fixed analysis size,
  // so the triangulation is identical in the preview and the export.
  const ANALYSIS = 360;
  let cache = { aspect: 0, sig: '', edges: null, aw: 0, ah: 0 };

  function edgeMap(srcCanvas) {
    const aspect = srcCanvas.width / srcCanvas.height;
    const sig = signature(srcCanvas);
    if (cache.edges && cache.aspect === aspect && cache.sig === sig) return cache;
    const aw = aspect >= 1 ? ANALYSIS : Math.round(ANALYSIS * aspect);
    const ah = aspect >= 1 ? Math.round(ANALYSIS / aspect) : ANALYSIS;
    const c = document.createElement('canvas');
    c.width = aw; c.height = ah;
    const cx = c.getContext('2d', { willReadFrequently: true });
    cx.drawImage(srcCanvas, 0, 0, aw, ah);
    const d = cx.getImageData(0, 0, aw, ah).data;
    const g = new Float32Array(aw * ah);
    for (let i = 0; i < aw * ah; i++) g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
    const edges = new Float32Array(aw * ah);
    for (let y = 1; y < ah - 1; y++) for (let x = 1; x < aw - 1; x++) {
      const i = y * aw + x;
      const gx = -g[i - aw - 1] - 2 * g[i - 1] - g[i + aw - 1] + g[i - aw + 1] + 2 * g[i + 1] + g[i + aw + 1];
      const gy = -g[i - aw - 1] - 2 * g[i - aw] - g[i - aw + 1] + g[i + aw - 1] + 2 * g[i + aw] + g[i + aw + 1];
      edges[i] = Math.sqrt(gx * gx + gy * gy);
    }
    cache = { aspect, sig, edges, aw, ah };
    return cache;
  }
  // Cheap fingerprint so preview and full-res versions of the same photo share the edge map
  function signature(c) {
    const t = document.createElement('canvas');
    t.width = 8; t.height = 8;
    const x = t.getContext('2d', { willReadFrequently: true });
    x.drawImage(c, 0, 0, 8, 8);
    return Array.from(x.getImageData(0, 0, 8, 8).data.filter((_, i) => i % 4 !== 3)).map(v => v >> 4).join('');
  }

  function points({ srcCanvas, W, H, p, rng }) {
    const { edges, aw, ah } = edgeMap(srcCanvas);
    // Probability per analysis pixel: mix of uniform and edge strength
    const focus = p.focus / 100;
    let mean = 0;
    for (let i = 0; i < edges.length; i++) mean += edges[i];
    mean /= edges.length;
    const cdf = new Float64Array(edges.length);
    let acc = 0;
    for (let i = 0; i < edges.length; i++) { acc += (1 - focus) * mean + focus * edges[i] * edges[i] / (mean || 1); cdf[i] = acc; }
    const pts = [];
    // Frame points so the mesh covers the whole image
    const n = 10;
    for (let i = 0; i <= n; i++) {
      pts.push([i / n * W, 0], [i / n * W, H], [0, i / n * H], [W, i / n * H]);
    }
    for (let q = 0; q < p.points; q++) {
      const target = rng() * acc;
      let lo = 0, hi = cdf.length - 1;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (cdf[mid] < target) lo = mid + 1; else hi = mid; }
      const x = (lo % aw + rng()) / aw * W, y = (((lo / aw) | 0) + rng()) / ah * H;
      pts.push([x, y]);
    }
    return pts;
  }

  function draw({ ctx, src, srcCanvas, W, H, p, rng, k }) {
    const pts = points({ srcCanvas, W, H, p, rng });
    const tri = d3.Delaunay.from(pts).triangles;
    const d = src.data;
    const sample = (x, y) => {
      const i = (Math.min(H - 1, Math.max(0, y | 0)) * W + Math.min(W - 1, Math.max(0, x | 0))) * 4;
      return [d[i], d[i + 1], d[i + 2]];
    };
    ctx.fillStyle = p.style === 'wire' ? p.bg : '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.lineJoin = 'round';
    const lw = p.stroke * k;
    for (let t = 0; t < tri.length; t += 3) {
      const a = pts[tri[t]], b = pts[tri[t + 1]], c = pts[tri[t + 2]];
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.closePath();
      if (p.style !== 'wire') {
        // average of the centroid and the three edge midpoints
        const cx = (a[0] + b[0] + c[0]) / 3, cy = (a[1] + b[1] + c[1]) / 3;
        const s = [sample(cx, cy), sample((a[0] + cx) / 2, (a[1] + cy) / 2), sample((b[0] + cx) / 2, (b[1] + cy) / 2), sample((c[0] + cx) / 2, (c[1] + cy) / 2)];
        const col = `rgb(${(s[0][0] + s[1][0] + s[2][0] + s[3][0]) >> 2},${(s[0][1] + s[1][1] + s[2][1] + s[3][1]) >> 2},${(s[0][2] + s[1][2] + s[2][2] + s[3][2]) >> 2})`;
        ctx.fillStyle = col;
        ctx.fill();
        // hide hairline gaps between filled triangles
        if (p.style === 'fill') { ctx.strokeStyle = col; ctx.lineWidth = Math.max(0.6, 0.6 * k); ctx.stroke(); }
      }
    }
    if (p.style !== 'fill' && lw > 0) {
      ctx.strokeStyle = p.line;
      ctx.globalAlpha = p.lineOpacity / 100;
      ctx.lineWidth = lw;
      ctx.beginPath();
      for (let t = 0; t < tri.length; t += 3) {
        const a = pts[tri[t]], b = pts[tri[t + 1]], c = pts[tri[t + 2]];
        ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.closePath();
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  const hasLines = p => p.style !== 'fill';
  PudrusTool.create({
    id: 'triangulation', i18n: 'triangulation', icon: '△',
    name: '△ Triangulation', desc: 'Low-poly reconstruction with Delaunay triangulation.',
    controls: [
      { key: 'points', label: 'triangulation.points', fallback: 'Detail', min: 50, max: 4000, step: 50, value: 900, rand: [200, 2500] },
      { key: 'focus', label: 'triangulation.focus', fallback: 'Follow edges', min: 0, max: 100, value: 70, unit: '%', rand: [30, 95] },
      { key: 'style', label: 'triangulation.style', fallback: 'Style', type: 'select', value: 'fill', options: [
        { value: 'fill', label: 'triangulation.styleFill', fallback: 'Solid' },
        { value: 'both', label: 'triangulation.styleBoth', fallback: 'Solid + lines' },
        { value: 'wire', label: 'triangulation.styleWire', fallback: 'Lines only' } ] },
      { key: 'line', label: 'triangulation.line', fallback: 'Line color', type: 'color', value: '#66ff33', show: hasLines },
      { key: 'bg', label: 'triangulation.bg', fallback: 'Background', type: 'color', value: '#050508', show: p => p.style === 'wire' },
      { key: 'stroke', label: 'triangulation.stroke', fallback: 'Line width', min: 0.2, max: 5, step: 0.1, value: 1, advanced: true, show: hasLines, rand: [0.4, 2] },
      { key: 'lineOpacity', label: 'triangulation.lineOpacity', fallback: 'Line opacity', min: 5, max: 100, value: 60, unit: '%', advanced: true, show: hasLines, rand: [20, 90] },
    ],
    presets: [
      { label: 'triangulation.presetLowpoly', fallback: 'Low-poly', values: { points: 400, focus: 60, style: 'fill' } },
      { label: 'triangulation.presetDetail', fallback: 'Detailed', values: { points: 2800, focus: 85, style: 'fill' } },
      { label: 'triangulation.presetMesh', fallback: 'Mesh', values: { points: 1200, focus: 75, style: 'both', line: '#ffffff', lineOpacity: 35 } },
      { label: 'triangulation.presetWire', fallback: 'Wireframe', values: { points: 1500, focus: 80, style: 'wire', line: '#66ff33', bg: '#050508', stroke: 0.8, lineOpacity: 90 } },
    ],
    draw,
  });
})();
</script>
