<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <title>Flyer Forge — PUDRUS.XYZ</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600;700&family=Bebas+Neue&family=Inter:wght@400;800&family=Major+Mono+Display&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/tool-shell.css">
</head>
<body>

<nav>
  <a href="../../index.html" class="nav-logo">PUDRUS<span>.xyz</span></a>
  <ul class="nav-links">
    <li><a href="../../index.html#tools" data-i18n="nav.tools">Tools</a></li>
  </ul>
  <div class="nav-lang">
    <select id="langSelect" aria-label="Language selector">
      <option value="es">ES</option>
      <option value="en">EN</option>
    </select>
  </div>
</nav>

<main id="tool"></main>

<script src="../../js/i18n.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/tool-shell.js"></script>
<script>
(function () {
  const FONTS = {
    archivo: { family: '"Archivo Black", sans-serif', main: '400', body: '400' },
    bebas:   { family: '"Bebas Neue", sans-serif', main: '400', body: '400' },
    inter:   { family: 'Inter, sans-serif', main: '800', body: '400' },
    space:   { family: '"Space Mono", monospace', main: '700', body: '400' },
    major:   { family: '"Major Mono Display", monospace', main: '400', body: '400' },
    courier: { family: '"Courier New", monospace', main: '700', body: '400' },
  };

  // ── text helpers (letter spacing done by hand so every browser matches) ──
  function width(ctx, text, sp) { return ctx.measureText(text).width + sp * Math.max(0, text.length - 1); }
  function wrap(ctx, text, maxW, sp) {
    const words = text.split(/\s+/).filter(Boolean), lines = [];
    let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (!cur || width(ctx, test, sp) <= maxW) cur = test;
      else { lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function fillLine(ctx, text, x, y, sp, stroke) {
    if (!sp) { if (stroke) ctx.strokeText(text, x, y); ctx.fillText(text, x, y); return; }
    for (const ch of text) {
      if (stroke) ctx.strokeText(ch, x, y);
      ctx.fillText(ch, x, y);
      x += ctx.measureText(ch).width + sp;
    }
  }

  function draw({ ctx, srcCanvas, W, H, p, rng, k }) {
    // Background image (cover) + darken
    ctx.drawImage(srcCanvas, 0, 0, W, H);
    if (p.dim > 0) { ctx.fillStyle = `rgba(0,0,0,${p.dim / 100})`; ctx.fillRect(0, 0, W, H); }

    const u = Math.min(W, H) / 100;
    const m = p.margin / 100 * Math.min(W, H);
    const font = FONTS[p.font];
    const up = s => (p.upper ? s.toUpperCase() : s);
    const defs = [];
    if (p.main.trim()) defs.push({ text: up(p.main.trim()), base: 15, weight: font.main, wrap: 1 });
    p.support.split(',').map(s => s.trim()).filter(Boolean).forEach(s => defs.push({ text: up(s), base: 5.5, weight: font.body, wrap: 0.9 }));
    if (p.date.trim()) defs.push({ text: up(p.date.trim()), base: 4.6, weight: font.body, wrap: 0.9 });
    if (p.venue.trim()) defs.push({ text: up(p.venue.trim()), base: 4.6, weight: font.body, wrap: 0.9 });

    // Fit: shrink everything until all blocks fit the free area
    const lh = p.lineHeight / 100, gap = 2.6 * u * (p.gap / 100);
    const availW = W - 2 * m, availH = H - 2 * m;
    let scale = p.size / 100, blocks = [];
    for (let attempt = 0; attempt < 14; attempt++) {
      blocks = defs.map(d => {
        let size = d.base * u * scale;
        let lines, w;
        for (let s = 0; s < 20; s++) {
          ctx.font = `${d.weight} ${size}px ${font.family}`;
          const sp = p.spacing / 100 * size;
          lines = wrap(ctx, d.text, availW * d.wrap, sp);
          w = Math.max(...lines.map(l => width(ctx, l, sp)));
          if (w <= availW * d.wrap || size < u) break;
          size *= 0.92;  // a single word is wider than the page
        }
        return { ...d, size, lines, w, h: lines.length * size * lh };
      });
      const total = blocks.reduce((a, b) => a + b.h, 0) + gap * Math.max(0, blocks.length - 1);
      if (total <= availH * (p.style === 'poster' ? 0.7 : 1)) break;
      scale *= 0.9;
    }

    // Placement
    const ox = p.offsetX / 100 * W, oy = p.offsetY / 100 * H;
    const total = blocks.reduce((a, b) => a + b.h, 0) + gap * Math.max(0, blocks.length - 1);
    if (p.style === 'poster') {
      const placed = [];
      for (const b of blocks) {
        let best = null;
        for (let tries = 0; tries < 150; tries++) {
          const x = m + rng() * Math.max(0, availW - b.w), y = m + rng() * Math.max(0, availH - b.h);
          const box = { x: x - u, y: y - u, w: b.w + 2 * u, h: b.h + 2 * u };
          if (!placed.some(o => box.x < o.x + o.w && box.x + box.w > o.x && box.y < o.y + o.h && box.y + box.h > o.y)) { best = { x, y, box }; break; }
          if (!best) best = { x, y, box };
        }
        placed.push(best.box);
        b.align = best.x < W * 0.25 ? 'left' : best.x + b.w > W * 0.75 ? 'right' : 'center';
        b.x = b.align === 'left' ? best.x : b.align === 'right' ? best.x + b.w : best.x + b.w / 2;
        b.y = best.y;
        b.rot = (rng() - 0.5) * 8;
      }
    } else {
      const align = p.style === 'center' ? 'center' : p.align;
      let y = p.style === 'center' ? (H - total) / 2 : p.style === 'bottom' ? H - m - total : m;
      for (const b of blocks) {
        b.align = align;
        b.x = align === 'left' ? m : align === 'right' ? W - m : W / 2;
        b.y = y;
        b.rot = 0;
        y += b.h + gap;
      }
    }

    // Draw
    ctx.textBaseline = 'top';
    for (const b of blocks) {
      ctx.save();
      ctx.font = `${b.weight} ${b.size}px ${font.family}`;
      const sp = p.spacing / 100 * b.size;
      ctx.translate(b.x + ox, b.y + oy);
      ctx.rotate((b.rot + p.rotation) * Math.PI / 180);
      b.lines.forEach((line, i) => {
        const lw = width(ctx, line, sp);
        const x = b.align === 'left' ? 0 : b.align === 'right' ? -lw : -lw / 2;
        const y = i * b.size * lh;
        if (p.box) {
          ctx.globalAlpha = p.boxOpacity / 100;
          ctx.fillStyle = p.boxColor;
          const pad = b.size * 0.18;
          ctx.fillRect(x - pad, y - pad * 0.6, lw + pad * 2, b.size + pad * 1.2);
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = p.color;
        if (p.stroke) { ctx.strokeStyle = p.strokeColor; ctx.lineWidth = p.strokeWidth * k; ctx.lineJoin = 'round'; }
        fillLine(ctx, line, x, y, sp, p.stroke);
      });
      ctx.restore();
    }

    if (p.watermark) {
      ctx.font = `${1.6 * u}px "Space Mono", monospace`;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.7;
      ctx.textAlign = 'right';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('pudrus.xyz', W - 2 * u, H - 2 * u);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }
  }

  const tool = PudrusTool.create({
    id: 'flyer', i18n: 'flyer', icon: '⎚',
    name: '⎚ Flyer Forge', desc: 'Event flyers with automatic layouts.',
    noFlyer: true,
    controls: [
      { key: 'main', label: 'flyer.mainLabel', fallback: 'Main act', type: 'text', value: 'PUDRUS', placeholder: 'flyer.mainAct' },
      { key: 'support', label: 'flyer.supportLabel', fallback: 'Support (comma separated)', type: 'text', value: 'Live A/V set, Guest DJ', placeholder: 'flyer.supportActs' },
      { key: 'date', label: 'flyer.dateLabel', fallback: 'Date', type: 'text', value: '24.11 — 23:00', placeholder: 'flyer.date' },
      { key: 'venue', label: 'flyer.venueLabel', fallback: 'Venue', type: 'text', value: 'Club XYZ', placeholder: 'flyer.venue' },
      { key: 'style', label: 'flyer.designStyle', fallback: 'Layout', type: 'select', value: 'swiss', options: [
        { value: 'swiss', label: 'flyer.styleSwiss', fallback: 'Swiss' },
        { value: 'center', label: 'flyer.styleCenter', fallback: 'Centered' },
        { value: 'bottom', label: 'flyer.styleBottom', fallback: 'Bottom' },
        { value: 'poster', label: 'flyer.stylePoster', fallback: 'Poster (random)' } ] },
      { key: 'font', label: 'flyer.fontFamily', fallback: 'Font', type: 'select', value: 'archivo', options: [
        { value: 'archivo', fallback: 'Archivo Black' },
        { value: 'bebas', fallback: 'Bebas Neue' },
        { value: 'inter', fallback: 'Inter' },
        { value: 'space', fallback: 'Space Mono' },
        { value: 'major', fallback: 'Major Mono Display' },
        { value: 'courier', fallback: 'Courier New' } ] },
      { key: 'color', label: 'flyer.color', fallback: 'Text color', type: 'color', value: '#ffffff', rand: true },
      { key: 'size', label: 'flyer.fontSize', fallback: 'Text size', min: 40, max: 200, value: 100, unit: '%', rand: [70, 150] },
      { key: 'dim', label: 'flyer.dim', fallback: 'Darken image', min: 0, max: 85, value: 25, unit: '%', rand: [0, 50] },
      { key: 'align', label: 'flyer.alignment', fallback: 'Alignment', type: 'select', value: 'left', advanced: true, show: p => p.style === 'swiss' || p.style === 'bottom', options: [
        { value: 'left', label: 'flyer.alignLeft', fallback: 'Left' },
        { value: 'right', label: 'flyer.alignRight', fallback: 'Right' },
        { value: 'center', label: 'flyer.alignCenter', fallback: 'Center' } ] },
      { key: 'upper', label: 'flyer.uppercase', fallback: 'Uppercase', type: 'toggle', value: true, advanced: true, randChance: 0.7 },
      { key: 'spacing', label: 'flyer.letterSpacing', fallback: 'Letter spacing', min: -10, max: 50, value: 0, unit: '%', advanced: true, rand: [-5, 25] },
      { key: 'lineHeight', label: 'flyer.lineHeight', fallback: 'Line height', min: 75, max: 160, value: 95, unit: '%', advanced: true, rand: [85, 120] },
      { key: 'gap', label: 'flyer.gap', fallback: 'Block spacing', min: 0, max: 300, value: 100, unit: '%', advanced: true, rand: [50, 200] },
      { key: 'margin', label: 'flyer.margin', fallback: 'Margin', min: 0, max: 20, value: 6, unit: '%', advanced: true, rand: [3, 12] },
      { key: 'offsetX', label: 'flyer.offsetX', fallback: 'Move X', min: -50, max: 50, value: 0, unit: '%', advanced: true, rand: false },
      { key: 'offsetY', label: 'flyer.offsetY', fallback: 'Move Y', min: -50, max: 50, value: 0, unit: '%', advanced: true, rand: false },
      { key: 'rotation', label: 'flyer.rotation', fallback: 'Rotation', min: -45, max: 45, value: 0, unit: '°', advanced: true, rand: [-8, 8] },
      { key: 'box', label: 'flyer.enableBg', fallback: 'Text background', type: 'toggle', value: false, advanced: true, randChance: 0.3 },
      { key: 'boxColor', label: 'flyer.bgColor', fallback: 'Background color', type: 'color', value: '#000000', advanced: true, show: p => p.box },
      { key: 'boxOpacity', label: 'flyer.bgOpacity', fallback: 'Background opacity', min: 10, max: 100, value: 70, unit: '%', advanced: true, show: p => p.box, rand: [40, 100] },
      { key: 'stroke', label: 'flyer.enableStroke', fallback: 'Text outline', type: 'toggle', value: false, advanced: true, randChance: 0.2 },
      { key: 'strokeColor', label: 'flyer.strokeColor', fallback: 'Outline color', type: 'color', value: '#000000', advanced: true, show: p => p.stroke },
      { key: 'strokeWidth', label: 'flyer.strokeWidth', fallback: 'Outline width', min: 0.5, max: 10, step: 0.5, value: 2, advanced: true, show: p => p.stroke, rand: [1, 4] },
      { key: 'watermark', label: 'flyer.watermark', fallback: 'pudrus.xyz watermark', type: 'toggle', value: true, advanced: true, rand: false },
    ],
    presets: [
      { label: 'flyer.presetSwiss', fallback: 'Swiss', values: { style: 'swiss', font: 'inter', size: 115, dim: 30, spacing: -3, lineHeight: 88 } },
      { label: 'flyer.presetRave', fallback: 'Rave', values: { style: 'center', font: 'archivo', color: '#66ff33', size: 130, dim: 45, spacing: 5 } },
      { label: 'flyer.presetPoster', fallback: 'Poster', values: { style: 'poster', font: 'bebas', size: 150, dim: 20, spacing: 4 } },
      { label: 'flyer.presetZine', fallback: 'Zine', values: { style: 'bottom', font: 'space', size: 95, dim: 10, box: true, boxColor: '#000000', boxOpacity: 85 } },
    ],
    draw,
  });

  // Canvas can't trigger web-font downloads by itself: load them, then redraw
  if (document.fonts) {
    Promise.all(['Archivo Black', 'Bebas Neue', 'Inter', 'Major Mono Display', 'Space Mono'].map(f => document.fonts.load(`40px "${f}"`)))
      .then(tool.render, () => {});
    document.fonts.load('800 40px Inter').then(tool.render, () => {});
    document.fonts.load('700 40px "Space Mono"').then(tool.render, () => {});
  }
})();
</script>
</body>
</html>
