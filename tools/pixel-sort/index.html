<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <title>Pixel Sorter — PUDRUS.XYZ</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/tool-shell.css">
</head>
<body>

<nav>
  <a href="../../index.html" class="nav-logo">PUDRUS<span>.xyz</span></a>
  <ul class="nav-links">
    <li><a href="../../index.html#tools" data-i18n="nav.tools">Tools</a></li>
  </ul>
  <div class="nav-lang">
    <select id="langSelect" aria-label="Language selector">
      <option value="es">ES</option>
      <option value="en">EN</option>
    </select>
  </div>
</nav>

<main id="tool"></main>

<script src="../../js/i18n.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/tool-shell.js"></script>
<script>
(function () {
  // Sort key 0..255 for a packed RGBA pixel (little endian: 0xAABBGGRR)
  const KEYS = {
    brightness: (r, g, b) => 0.299 * r + 0.587 * g + 0.114 * b,
    hue: (r, g, b) => {
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), c = mx - mn;
      if (!c) return 0;
      let h = mx === r ? ((g - b) / c) % 6 : mx === g ? (b - r) / c + 2 : (r - g) / c + 4;
      return ((h * 60 + 360) % 360) / 360 * 255;
    },
    saturation: (r, g, b) => { const mx = Math.max(r, g, b); return mx ? (mx - Math.min(r, g, b)) / mx * 255 : 0; },
  };

  function render({ src, out, W, H, p, rng }) {
    out.data.set(src.data);
    const px = new Uint32Array(out.data.buffer);
    const keyFn = KEYS[p.sortBy];
    const lo = p.low / 100 * 255, hi = p.high / 100 * 255;
    const vertical = p.direction === 'vertical';
    const lines = vertical ? W : H, len = vertical ? H : W;
    const maxRun = Math.max(2, Math.round(len * p.length / 100));

    const keys = new Float32Array(len), idx = new Uint32Array(len), seg = new Uint32Array(len);
    const order = new Uint32Array(len);
    for (let l = 0; l < lines; l++) {
      if (rng() > p.coverage / 100) continue;
      // positions of this line in the pixel array
      for (let i = 0; i < len; i++) {
        const pi = vertical ? i * W + l : l * W + i;
        idx[i] = pi;
        const v = px[pi];
        keys[i] = keyFn(v & 255, (v >>> 8) & 255, (v >>> 16) & 255);
      }
      let i = 0;
      while (i < len) {
        if (keys[i] < lo || keys[i] > hi) { i++; continue; }
        // run of pixels inside the threshold, cut to a (random) maximum length
        const runMax = Math.max(2, Math.round(maxRun * (1 - (p.randomness / 100) * rng())));
        let j = i;
        while (j < len && j - i < runMax && keys[j] >= lo && keys[j] <= hi) j++;
        const n = j - i;
        if (n > 1) {
          for (let q = 0; q < n; q++) { order[q] = i + q; seg[q] = px[idx[i + q]]; }
          const sub = order.subarray(0, n);
          sub.sort(p.reverse ? (a, b) => keys[b] - keys[a] : (a, b) => keys[a] - keys[b]);
          for (let q = 0; q < n; q++) px[idx[i + q]] = seg[sub[q] - i];
        }
        i = j + 1;
      }
    }
  }

  PudrusTool.create({
    id: 'pixel-sort', i18n: 'pixel', icon: '⟆',
    name: '⟆ Pixel Sorter', desc: 'Sort pixels by brightness, hue or saturation.',
    controls: [
      { key: 'direction', label: 'pixel.direction', fallback: 'Direction', type: 'select', value: 'vertical', options: [
        { value: 'vertical', label: 'pixel.dirVertical', fallback: 'Vertical' },
        { value: 'horizontal', label: 'pixel.dirHorizontal', fallback: 'Horizontal' } ] },
      { key: 'sortBy', label: 'pixel.sortBy', fallback: 'Sort by', type: 'select', value: 'brightness', options: [
        { value: 'brightness', label: 'pixel.byBrightness', fallback: 'Brightness' },
        { value: 'hue', label: 'pixel.byHue', fallback: 'Hue' },
        { value: 'saturation', label: 'pixel.bySaturation', fallback: 'Saturation' } ] },
      { key: 'low', label: 'pixel.low', fallback: 'Ignore darker than', min: 0, max: 100, value: 25, unit: '%', rand: [5, 50] },
      { key: 'high', label: 'pixel.high', fallback: 'Ignore brighter than', min: 0, max: 100, value: 90, unit: '%', rand: [60, 100] },
      { key: 'length', label: 'pixel.length', fallback: 'Streak length', min: 1, max: 100, value: 40, unit: '%', rand: [10, 90] },
      { key: 'coverage', label: 'pixel.coverage', fallback: 'Coverage', min: 0, max: 100, value: 100, unit: '%', advanced: true, rand: [50, 100] },
      { key: 'randomness', label: 'pixel.randomness', fallback: 'Randomness', min: 0, max: 100, value: 30, unit: '%', advanced: true, rand: [0, 80] },
      { key: 'reverse', label: 'pixel.reverse', fallback: 'Reverse order', type: 'toggle', value: false, advanced: true, randChance: 0.4 },
    ],
    presets: [
      { label: 'pixel.presetMelt', fallback: 'Melt', values: { direction: 'vertical', low: 20, high: 95, length: 70, randomness: 20 } },
      { label: 'pixel.presetWind', fallback: 'Wind', values: { direction: 'horizontal', low: 30, high: 85, length: 45, randomness: 50 } },
      { label: 'pixel.presetShards', fallback: 'Shards', values: { direction: 'vertical', sortBy: 'hue', low: 10, high: 70, length: 25, randomness: 70, coverage: 80 } },
      { label: 'pixel.presetSoft', fallback: 'Subtle', values: { direction: 'horizontal', low: 45, high: 80, length: 15, randomness: 40 } },
    ],
    render,
  });
})();
</script>
</body>
</html>
