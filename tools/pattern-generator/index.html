<script src="../../js/tool-shell.js"></script>
<script>
(function () {
  const PALETTES = {
    neon:  ['#050508', '#00331a', '#00bb16', '#66ff33', '#e6ffd9'],
    ember: ['#120404', '#731717', '#bf311a', '#f27405', '#f2d705'],
    ocean: ['#010d1a', '#033e73', '#0468bf', '#049dd9', '#a6f2ff'],
    vapor: ['#12002b', '#4b0082', '#ff00c8', '#00e5ff', '#ffffff'],
    mono:  ['#000000', '#333333', '#777777', '#bbbbbb', '#ffffff'],
  };
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const lutCache = {};
  function lut(name) {
    if (lutCache[name]) return lutCache[name];
    const pal = PALETTES[name].map(hex), out = new Uint8ClampedArray(256 * 3);
    for (let i = 0; i < 256; i++) {
      const v = i / 255 * (pal.length - 1), a = Math.floor(v), t = v - a, b = Math.min(pal.length - 1, a + 1);
      for (let c = 0; c < 3; c++) out[i * 3 + c] = pal[a][c] + (pal[b][c] - pal[a][c]) * t;
    }
    return (lutCache[name] = out);
  }

  // Seeded 3D Perlin noise
  function perlin(seed) {
    let s = seed >>> 0 || 1;
    const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
    const perm = new Uint8Array(512), base = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [base[i], base[j]] = [base[j], base[i]]; }
    for (let i = 0; i < 512; i++) perm[i] = base[i & 255];
    const fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (t, a, b) => a + t * (b - a);
    const grad = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    return (x, y, z) => {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z, B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
      return lerp(w, lerp(v, lerp(u, grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z)), lerp(u, grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z))),
        lerp(v, lerp(u, grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1)), lerp(u, grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1))));
    };
  }
  let noiseCache = { seed: null, fn: null };
  const noiseFor = seed => (noiseCache.seed === seed ? noiseCache.fn : (noiseCache = { seed, fn: perlin(seed) }).fn);

  // Paints a small Uint8 RGB buffer computed by fn(x, y) -> 0..255, then scales it up smoothly
  function lowRes(ctx, W, H, ds, fn) {
    const w = Math.ceil(W / ds), h = Math.ceil(H / ds);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const cx = c.getContext('2d'), img = cx.createImageData(w, h), d = img.data;
    fn(d, w, h);
    cx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(c, 0, 0, W, H);
  }

  const ALGOS = {
    noise({ ctx, W, H, p, k, t, seed }) {
      const noise = noiseFor(seed), L = lut(p.palette), ds = 3;
      const sc = p.scale * k, z = t * p.speed * 0.15;
      lowRes(ctx, W, H, ds, (d, w, h) => {
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
          let tot = 0, amp = 1, freq = 1, max = 0;
          for (let o = 0; o < p.octaves; o++) {
            tot += noise(x * ds / sc * freq, y * ds / sc * freq, z * freq) * amp;
            max += amp; amp *= p.detail / 100; freq *= 2;
          }
          const li = Math.max(0, Math.min(255, ((tot / max) * 1.4 + 1) * 127.5 | 0)) * 3, i = (y * w + x) * 4;
          d[i] = L[li]; d[i + 1] = L[li + 1]; d[i + 2] = L[li + 2]; d[i + 3] = 255;
        }
      });
    },

    flow({ ctx, W, H, p, k, t, rng, seed }) {
      const noise = noiseFor(seed), pal = PALETTES[p.palette];
      ctx.fillStyle = pal[0]; ctx.fillRect(0, 0, W, H);
      const sc = p.scale * k * 2, step = 2 * k, z = t * p.speed * 0.08;
      ctx.lineWidth = Math.max(0.5, 0.8 * k);
      ctx.globalAlpha = 0.35;
      for (let c = 1; c < pal.length; c++) {
        ctx.strokeStyle = pal[c];
        ctx.beginPath();
        const n = Math.round(p.particles / (pal.length - 1));
        for (let q = 0; q < n; q++) {
          let x = rng() * W, y = rng() * H;
          ctx.moveTo(x, y);
          for (let s = 0; s < p.length; s++) {
            const a = noise(x / sc, y / sc, z) * Math.PI * 2 * (p.turbulence / 25);
            x += Math.cos(a) * step; y += Math.sin(a) * step;
            if (x < 0 || y < 0 || x > W || y > H) break;
            ctx.lineTo(x, y);
          }
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    },

    voronoi({ ctx, W, H, p, t, rng }) {
      const L = lut(p.palette), ds = 3;
      const sites = Array.from({ length: p.sites }, () => ({ x: rng(), y: rng(), ph: rng() * 6.28, r: 0.02 + rng() * 0.05 }));
      const pos = sites.map(s => [(s.x + Math.sin(t * p.speed * 0.3 + s.ph) * s.r) * W, (s.y + Math.cos(t * p.speed * 0.3 + s.ph) * s.r) * H]);
      const cell = Math.sqrt(W * H / p.sites);
      lowRes(ctx, W, H, ds, (d, w, h) => {
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
          const fx = x * ds, fy = y * ds;
          let d1 = Infinity, d2 = Infinity;
          for (let i = 0; i < pos.length; i++) {
            const dx = pos[i][0] - fx, dy = pos[i][1] - fy, dd = dx * dx + dy * dy;
            if (dd < d1) { d2 = d1; d1 = dd; } else if (dd < d2) d2 = dd;
          }
          // edges = small (d2 - d1); cells = distance to centre
          const v = p.cells ? Math.sqrt(d1) / cell : 1 - Math.min(1, (Math.sqrt(d2) - Math.sqrt(d1)) / (cell * 0.35));
          const li = Math.max(0, Math.min(255, v * 255 | 0)) * 3, i = (y * w + x) * 4;
          d[i] = L[li]; d[i + 1] = L[li + 1]; d[i + 2] = L[li + 2]; d[i + 3] = 255;
        }
      });
    },

    attractor({ ctx, W, H, p, k, t, seed }) {
      // Peter de Jong attractor, accumulated as a density map
      const s = seed % 1000 / 1000;
      const a = p.a + Math.sin(t * p.speed * 0.2) * 0.15 + s * 0.1, b = p.b + Math.cos(t * p.speed * 0.17) * 0.15;
      const c = p.c, dd = p.d + Math.sin(t * p.speed * 0.13) * 0.1;
      const ds = Math.max(1, Math.round(k));
      const w = Math.ceil(W / ds), h = Math.ceil(H / ds);
      const dens = new Uint32Array(w * h);
      const zoom = Math.min(w, h) * 0.22 * (p.zoom / 100);
      let x = 0.1, y = 0.1, max = 0;
      const n = p.iterations * 1000;
      for (let i = 0; i < n; i++) {
        const nx = Math.sin(a * y) - Math.cos(b * x), ny = Math.sin(c * x) - Math.cos(dd * y);
        x = nx; y = ny;
        const px = (w / 2 + x * zoom) | 0, py = (h / 2 + y * zoom) | 0;
        if (px >= 0 && py >= 0 && px < w && py < h) { const v = ++dens[py * w + px]; if (v > max) max = v; }
      }
      const L = lut(p.palette), lm = Math.log(max + 1);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d'), img = cx.createImageData(w, h), dt = img.data;
      for (let i = 0; i < dens.length; i++) {
        const li = Math.min(255, (Math.pow(Math.log(dens[i] + 1) / lm, 0.8) * 255) | 0) * 3;
        dt[i * 4] = L[li]; dt[i * 4 + 1] = L[li + 1]; dt[i * 4 + 2] = L[li + 2]; dt[i * 4 + 3] = 255;
      }
      cx.putImageData(img, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(cv, 0, 0, W, H);
    },
  };

  const algo = (...names) => p => names.includes(p.algo);
  PudrusTool.create({
    id: 'pattern', i18n: 'pattern', icon: '▦',
    name: '▦ Pattern Generator', desc: 'Generative patterns: noise, flow fields, Voronoi and attractors.',
    generator: { formats: [
      { value: 'square', label: 'shell.fmtSquare', fallback: 'Square 1:1', w: 2160, h: 2160 },
      { value: 'portrait', label: 'shell.fmtPortrait', fallback: 'Portrait 4:5', w: 2160, h: 2700 },
      { value: 'story', label: 'shell.fmtStory', fallback: 'Story 9:16', w: 2160, h: 3840 },
      { value: 'wide', label: 'shell.fmtWide', fallback: 'Wide 16:9', w: 3840, h: 2160 },
    ] },
    animated: true,
    noFlyer: false,
    controls: [
      { key: 'algo', label: 'pattern.algorithm', fallback: 'Algorithm', type: 'select', value: 'noise', options: [
        { value: 'noise', label: 'pattern.noise', fallback: 'Noise' },
        { value: 'flow', label: 'pattern.flow', fallback: 'Flow field' },
        { value: 'voronoi', label: 'pattern.voronoi', fallback: 'Voronoi' },
        { value: 'attractor', label: 'pattern.attractor', fallback: 'Attractor' } ] },
      { key: 'palette', label: 'pattern.palette', fallback: 'Palette', type: 'select', value: 'neon', options: [
        { value: 'neon', label: 'pattern.palNeon', fallback: 'Neon' },
        { value: 'ember', label: 'pattern.palEmber', fallback: 'Ember' },
        { value: 'ocean', label: 'pattern.palOcean', fallback: 'Ocean' },
        { value: 'vapor', label: 'pattern.palVapor', fallback: 'Vapor' },
        { value: 'mono', label: 'pattern.palMono', fallback: 'Mono' } ] },
      { key: 'scale', label: 'pattern.params.scale', fallback: 'Scale', min: 20, max: 600, step: 10, value: 220, show: algo('noise', 'flow'), rand: [80, 450] },
      { key: 'octaves', label: 'pattern.params.octaves', fallback: 'Octaves', min: 1, max: 7, value: 4, show: algo('noise'), rand: [2, 6] },
      { key: 'detail', label: 'pattern.params.persistence', fallback: 'Roughness', min: 20, max: 80, value: 50, unit: '%', show: algo('noise'), advanced: true, rand: [35, 65] },
      { key: 'particles', label: 'pattern.params.particles', fallback: 'Particles', min: 100, max: 4000, step: 100, value: 1500, show: algo('flow'), rand: [500, 3000] },
      { key: 'length', label: 'pattern.params.length', fallback: 'Trail length', min: 10, max: 300, step: 10, value: 120, show: algo('flow'), rand: [40, 250] },
      { key: 'turbulence', label: 'pattern.params.turbulence', fallback: 'Turbulence', min: 5, max: 100, value: 30, show: algo('flow'), advanced: true, rand: [10, 70] },
      { key: 'sites', label: 'pattern.params.sites', fallback: 'Cells', min: 5, max: 200, step: 5, value: 40, show: algo('voronoi'), rand: [10, 120] },
      { key: 'cells', label: 'pattern.params.cells', fallback: 'Fill cells (instead of edges)', type: 'toggle', value: false, show: algo('voronoi'), randChance: 0.5 },
      { key: 'a', label: 'pattern.params.a', fallback: 'Shape A', min: -3, max: 3, step: 0.02, value: 1.4, show: algo('attractor'), rand: [-3, 3] },
      { key: 'b', label: 'pattern.params.b', fallback: 'Shape B', min: -3, max: 3, step: 0.02, value: -2.3, show: algo('attractor'), rand: [-3, 3] },
      { key: 'c', label: 'pattern.params.c', fallback: 'Shape C', min: -3, max: 3, step: 0.02, value: 2.4, show: algo('attractor'), advanced: true, rand: [-3, 3] },
      { key: 'd', label: 'pattern.params.d', fallback: 'Shape D', min: -3, max: 3, step: 0.02, value: -2.1, show: algo('attractor'), advanced: true, rand: [-3, 3] },
      { key: 'iterations', label: 'pattern.params.iterations', fallback: 'Density', min: 50, max: 2000, step: 50, value: 400, unit: 'k', show: algo('attractor'), advanced: true, rand: [200, 800] },
      { key: 'zoom', label: 'pattern.params.zoom', fallback: 'Zoom', min: 40, max: 200, value: 100, unit: '%', show: algo('attractor'), advanced: true, rand: [80, 130] },
      { key: 'speed', label: 'pattern.params.speed', fallback: 'Animation speed', min: 0.1, max: 5, step: 0.1, value: 1, advanced: true, rand: false },
    ],
    presets: [
      { label: 'pattern.presetClouds', fallback: 'Clouds', values: { algo: 'noise', palette: 'ocean', scale: 400, octaves: 6, detail: 55 } },
      { label: 'pattern.presetSilk', fallback: 'Silk', values: { algo: 'flow', palette: 'vapor', scale: 300, particles: 2500, length: 200, turbulence: 25 } },
      { label: 'pattern.presetCells', fallback: 'Cells', values: { algo: 'voronoi', palette: 'neon', sites: 60 } },
      { label: 'pattern.presetNebula', fallback: 'Nebula', values: { algo: 'attractor', palette: 'ember', a: -2.0, b: -2.0, c: -1.2, d: 2.0, iterations: 600 } },
    ],
    draw(args) { ALGOS[args.p.algo](args); },
  });
})();
</script>
