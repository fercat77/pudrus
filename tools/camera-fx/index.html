<script>
(function () {
  const t = (k, fb, v) => (window.pudrusT ? window.pudrusT(k, fb, v) : fb);

  /* ── Looks ──────────────────────────────────────────────
     Every look is one branch of the same fragment shader and reads up to four
     parameters (u_p.xyzw, all 0..1). "comp" says which component a control drives. */
  const PALETTES = {
    gameboy: ['#0f380f', '#306230', '#8bac0f', '#9bbc0f'],
    bw:      ['#000000', '#000000', '#ffffff', '#ffffff'],
    cga:     ['#000000', '#ff55ff', '#55ffff', '#ffffff'],
    pudrus:  ['#050508', '#00662c', '#66ff33', '#d0efff'],
  };
  const LOOKS = [
    { id: 'original', icon: '◌', label: 'camera.lookOriginal', fb: 'Original', params: [] },
    { id: 'glitch', icon: '▓', label: 'camera.lookGlitch', fb: 'Glitch', params: [
      { key: 'rgb', comp: 0, label: 'camera.rgb', fb: 'RGB split', value: 45 },
      { key: 'blocks', comp: 1, label: 'camera.blocks', fb: 'Blocks', value: 35 },
      { key: 'tear', comp: 2, label: 'camera.tear', fb: 'Tearing', value: 40 },
      { key: 'noise', comp: 3, label: 'camera.noise', fb: 'Noise', value: 20 } ] },
    { id: 'vhs', icon: '⏎', label: 'camera.lookVhs', fb: 'VHS / CRT', params: [
      { key: 'curve', comp: 0, label: 'camera.curvature', fb: 'Curvature', value: 40 },
      { key: 'scan', comp: 1, label: 'camera.scanlines', fb: 'Scanlines', value: 55 },
      { key: 'vig', comp: 2, label: 'camera.vignette', fb: 'Vignette', value: 50 },
      { key: 'noise', comp: 3, label: 'camera.noise', fb: 'Noise', value: 35 } ] },
    { id: 'dither', icon: '⠿', label: 'camera.lookDither', fb: 'Dither', params: [
      { key: 'palette', comp: -1, type: 'select', label: 'camera.palette', fb: 'Palette', value: 'gameboy', options: [
        { value: 'gameboy', label: 'dithering.palGameboy', fb: 'Game Boy' },
        { value: 'bw', label: 'dithering.palBw', fb: '1-bit' },
        { value: 'cga', label: 'dithering.palCga', fb: 'CGA' },
        { value: 'pudrus', label: 'dithering.palPudrus', fb: 'PUDRUS' } ] },
      { key: 'pixel', comp: 0, label: 'camera.pixel', fb: 'Pixel size', value: 30 },
      { key: 'contrast', comp: 2, label: 'camera.contrast', fb: 'Contrast', value: 35 } ] },
    { id: 'halftone', icon: '◉', label: 'camera.lookHalftone', fb: 'Halftone', params: [
      { key: 'dot', comp: 0, label: 'camera.dot', fb: 'Dot size', value: 30 },
      { key: 'angle', comp: 1, label: 'camera.angle', fb: 'Angle', value: 50 },
      { key: 'color', comp: 2, type: 'toggle', label: 'camera.colorDots', fb: 'Color dots', value: false } ] },
    { id: 'ascii', icon: '◊', label: 'camera.lookAscii', fb: 'ASCII', params: [
      { key: 'cell', comp: 0, label: 'camera.cell', fb: 'Character size', value: 25 },
      { key: 'tint', comp: 1, type: 'select', label: 'camera.tint', fb: 'Color', value: 0, options: [
        { value: 0, label: 'ascii.colorGreen', fb: 'Terminal green' },
        { value: 0.5, label: 'ascii.colorOriginal', fb: 'Image colors' },
        { value: 1, label: 'ascii.colorAmber', fb: 'Amber' } ] },
      { key: 'contrast', comp: 2, label: 'camera.contrast', fb: 'Contrast', value: 40 } ] },
    { id: 'neon', icon: '⌁', label: 'camera.lookNeon', fb: 'Neon', params: [
      { key: 'glow', comp: 0, label: 'camera.strength', fb: 'Strength', value: 50 },
      { key: 'hue', comp: 1, label: 'camera.hue', fb: 'Hue', value: 30 },
      { key: 'base', comp: 2, label: 'camera.keep', fb: 'Keep image', value: 15 },
      { key: 'cycle', comp: 3, type: 'toggle', label: 'camera.cycle', fb: 'Cycle colors', value: false } ] },
    { id: 'thermal', icon: '◍', label: 'camera.lookThermal', fb: 'Thermal', params: [
      { key: 'mode', comp: 1, type: 'select', label: 'camera.mode', fb: 'Mode', value: 0, options: [
        { value: 0, label: 'camera.modeThermal', fb: 'Thermal' },
        { value: 1, label: 'camera.modeNight', fb: 'Night vision' } ] },
      { key: 'contrast', comp: 0, label: 'camera.contrast', fb: 'Contrast', value: 40 },
      { key: 'noise', comp: 2, label: 'camera.noise', fb: 'Noise', value: 30 } ] },
    { id: 'pixel', icon: '▦', label: 'camera.lookPixel', fb: 'Pixel', params: [
      { key: 'size', comp: 0, label: 'camera.pixel', fb: 'Pixel size', value: 30 },
      { key: 'levels', comp: 1, label: 'camera.levels', fb: 'Colors', value: 35 },
      { key: 'grid', comp: 2, label: 'camera.grid', fb: 'Grid', value: 0 } ] },
  ];

  /* ── Shader ─────────────────────────────────────────── */
  const VERT = `attribute vec2 a_pos; varying vec2 v_uv;
    void main(){ v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }`;
  const FRAG = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif
    varying vec2 v_uv;
    uniform sampler2D u_tex, u_glyphs;
    uniform vec2 u_res;
    uniform float u_time, u_look, u_mirror;
    uniform vec4 u_p;
    uniform vec3 u_pal0, u_pal1, u_pal2, u_pal3;
    const float NCHARS = 10.0;

    vec3 src(vec2 uv){ uv = clamp(uv, 0.0, 1.0); if (u_mirror > 0.5) uv.x = 1.0 - uv.x; return texture2D(u_tex, uv).rgb; }
    float luma(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float bayer2(vec2 a){ a = floor(a); return fract(a.x * 0.5 + a.y * a.y * 0.75); }
    float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    float bayer8(vec2 a){ return bayer4(0.5 * a) * 0.25 + bayer2(a); }
    vec3 pal(float i){ if (i < 0.5) return u_pal0; if (i < 1.5) return u_pal1; if (i < 2.5) return u_pal2; return u_pal3; }
    vec3 hsv(float h, float s, float v){ vec3 k = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0); return v * mix(vec3(1.0), k, s); }
    float contrast(float l, float c){ return clamp((l - 0.5) * (1.0 + c * 2.5) + 0.5, 0.0, 1.0); }

    vec3 glitch(vec2 uv){
      float tk = floor(u_time * 12.0);
      float band = floor(uv.y * 48.0);
      float tear = hash(vec2(band, tk)) > 1.0 - u_p.z * 0.5 ? (hash(vec2(tk, band)) - 0.5) * 0.18 * u_p.z : 0.0;
      vec2 blk = floor(uv * vec2(14.0, 22.0));
      float on = step(1.0 - u_p.y * 0.3, hash(blk + tk * 0.37));
      vec2 b = uv + vec2(tear + on * (hash(blk * 1.7 + tk) - 0.5) * 0.25, 0.0);
      float s = u_p.x * 0.035;
      vec3 c = vec3(src(b + vec2(s, 0.0)).r, src(b).g, src(b - vec2(s, 0.0)).b);
      if (on > 0.5 && hash(blk + tk * 2.0) > 0.55) c = c.gbr;
      return c + (hash(uv * u_res + tk) - 0.5) * u_p.w * 0.6;
    }
    vec3 vhs(vec2 uv){
      vec2 cc = uv * 2.0 - 1.0; float r2 = dot(cc, cc);
      cc *= 1.0 + r2 * u_p.x * 0.28;
      vec2 q = cc * 0.5 + 0.5;
      if (q.x < 0.0 || q.x > 1.0 || q.y < 0.0 || q.y > 1.0) return vec3(0.0);
      q.x += (hash(vec2(floor(q.y * u_res.y / 2.0), floor(u_time * 30.0))) - 0.5) * 0.004 * u_p.w;   // tracking jitter
      float ab = 0.0015 + u_p.w * 0.004;
      vec3 c = vec3(src(q + vec2(ab, 0.0)).r, src(q).g, src(q - vec2(ab, 0.0)).b);
      float line = 0.5 + 0.5 * cos(q.y * u_res.y * 2.0944);          // a scanline every 3 px
      c *= 1.0 - u_p.y * 0.55 * line;
      c *= 1.0 - u_p.z * smoothstep(0.35, 1.7, r2);
      c += (hash(q * u_res + u_time) - 0.5) * u_p.w * 0.22;
      c *= 1.0 + 0.04 * u_p.w * sin(q.y * 8.0 - u_time * 6.0);       // rolling bar
      return c * 1.08;
    }
    vec3 dither(vec2 uv){
      float ps = 1.0 + floor(u_p.x * 7.0);
      vec2 px = floor(uv * u_res / ps);
      float l = contrast(luma(src((px + 0.5) * ps / u_res)), u_p.z);
      float q = clamp(floor(l * 3.0 + bayer8(px) - 0.5 + 0.5), 0.0, 3.0);
      return pal(q);
    }
    vec3 halftone(vec2 uv){
      float cell = 5.0 + u_p.x * 22.0;
      float a = u_p.y * 1.5708, ca = cos(a), sa = sin(a);
      mat2 R = mat2(ca, sa, -sa, ca), Ri = mat2(ca, -sa, sa, ca);
      vec2 rp = R * (uv * u_res);
      vec2 cen = (floor(rp / cell) + 0.5) * cell;
      vec3 col = src((Ri * cen) / u_res);
      float rad = sqrt(1.0 - luma(col)) * cell * 0.72;
      float ink = 1.0 - smoothstep(rad - 1.0, rad + 1.0, length(rp - cen));
      vec3 inkc = u_p.z > 0.5 ? col * 0.85 : vec3(0.07);
      return mix(vec3(0.96, 0.94, 0.9), inkc, ink);
    }
    vec3 ascii(vec2 uv){
      float cw = 6.0 + u_p.x * 16.0;
      vec2 cs = vec2(cw, cw * 1.6), p = uv * u_res, cell = floor(p / cs);
      vec3 col = src((cell + 0.5) * cs / u_res);
      float l = min(contrast(luma(col), u_p.z), 0.999);
      float idx = floor(l * NCHARS);
      vec2 f = fract(p / cs);
      float g = texture2D(u_glyphs, vec2((idx + f.x) / NCHARS, f.y)).r;
      vec3 tint = u_p.y < 0.25 ? vec3(0.4, 1.0, 0.2) : (u_p.y > 0.75 ? vec3(1.0, 0.69, 0.0) : col * 1.5 + 0.1);
      return tint * g;
    }
    vec3 neon(vec2 uv){
      vec2 d = (1.0 + u_p.x * 1.5) / u_res;
      float tl = luma(src(uv + d * vec2(-1.0, 1.0))), t = luma(src(uv + d * vec2(0.0, 1.0))), tr = luma(src(uv + d * vec2(1.0, 1.0)));
      float l = luma(src(uv + d * vec2(-1.0, 0.0))), r = luma(src(uv + d * vec2(1.0, 0.0)));
      float bl = luma(src(uv + d * vec2(-1.0, -1.0))), b = luma(src(uv + d * vec2(0.0, -1.0))), br = luma(src(uv + d * vec2(1.0, -1.0)));
      float gx = -tl - 2.0 * l - bl + tr + 2.0 * r + br, gy = tl + 2.0 * t + tr - bl - 2.0 * b - br;
      float e = smoothstep(0.08, 0.5, length(vec2(gx, gy)) * (1.0 + u_p.x * 2.0));
      float h = u_p.y + (u_p.w > 0.5 ? u_time * 0.08 + uv.y * 0.3 : 0.0);
      return src(uv) * u_p.z * 0.7 + hsv(fract(h), 0.85, 1.0) * e * 1.4;
    }
    vec3 thermal(vec2 uv){
      float l = contrast(luma(src(uv)), u_p.x);
      if (u_p.y < 0.5) {
        vec3 c = mix(vec3(0.0, 0.0, 0.15), vec3(0.35, 0.0, 0.6), smoothstep(0.0, 0.25, l));
        c = mix(c, vec3(0.9, 0.05, 0.2), smoothstep(0.25, 0.5, l));
        c = mix(c, vec3(1.0, 0.6, 0.0), smoothstep(0.5, 0.75, l));
        c = mix(c, vec3(1.0, 1.0, 0.85), smoothstep(0.75, 1.0, l));
        return c + (hash(uv * u_res + u_time) - 0.5) * u_p.z * 0.12;
      }
      vec3 c = vec3(0.15, 1.0, 0.3) * (l * 1.3 + 0.04);
      c *= 1.0 - 0.18 * (0.5 + 0.5 * cos(uv.y * u_res.y * 3.1416));
      c += (hash(uv * u_res + u_time) - 0.5) * u_p.z * 0.45;
      vec2 cc = uv * 2.0 - 1.0; cc.x *= u_res.x / u_res.y;
      return c * (1.0 - smoothstep(0.8, 1.35, length(cc)));
    }
    vec3 pixel(vec2 uv){
      float ps = 2.0 + floor(u_p.x * 30.0);
      vec2 g = uv * u_res / ps;
      vec3 c = src((floor(g) + 0.5) * ps / u_res);
      float lv = 2.0 + floor(u_p.y * 10.0);
      c = floor(c * lv + 0.5) / lv;
      vec2 f = fract(g);
      float w = u_p.z * 0.2;
      return c * (1.0 - 0.6 * (step(f.x, w) + step(f.y, w) > 0.0 ? 1.0 : 0.0));
    }
    void main(){
      vec2 uv = v_uv; vec3 c;
      if (u_look < 0.5) c = src(uv);
      else if (u_look < 1.5) c = glitch(uv);
      else if (u_look < 2.5) c = vhs(uv);
      else if (u_look < 3.5) c = dither(uv);
      else if (u_look < 4.5) c = halftone(uv);
      else if (u_look < 5.5) c = ascii(uv);
      else if (u_look < 6.5) c = neon(uv);
      else if (u_look < 7.5) c = thermal(uv);
      else c = pixel(uv);
      gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
    }`;

  /* ── State ──────────────────────────────────────────── */
  const store = { get(k, d) { try { const v = localStorage.getItem('pudrus_cam_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                  set(k, v) { try { localStorage.setItem('pudrus_cam_' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } } };
  const defaults = {};
  LOOKS.forEach(L => { defaults[L.id] = Object.fromEntries(L.params.map(p => [p.key, p.value])); });
  const saved = store.get('params', {});
  const state = {
    look: Math.max(0, LOOKS.findIndex(L => L.id === store.get('look', 'vhs'))),
    params: Object.fromEntries(LOOKS.map(L => [L.id, { ...defaults[L.id], ...(saved[L.id] || {}) }])),
    mirror: store.get('mirror', true),
    sound: store.get('sound', false),
    videoAudio: store.get('videoAudio', true),
    quality: store.get('quality', 720),
    facing: 'user',
    source: null,        // HTMLVideoElement | HTMLImageElement
    kind: null,          // 'camera' | 'video' | 'image'
    stream: null,
    recorder: null,
  };

  /* ── DOM ────────────────────────────────────────────── */
  const el = (tag, attrs = {}, kids = []) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
    }
    [].concat(kids).forEach(c => c && e.append(c));
    return e;
  };
  document.body.classList.add('ts-page');
  const root = document.getElementById('tool');
  root.className = 'ts';

  const canvas = el('canvas', { class: 'ts-canvas' });
  const statusEl = el('div', { class: 'ts-status', role: 'status', 'aria-live': 'polite' });
  const timerEl = el('div', { class: 'cam-timer', hidden: true });
  const flash = el('div', { class: 'cam-flash' });
  const fileInput = el('input', { type: 'file', accept: 'video/*,image/*', class: 'ts-file', tabindex: '-1', 'aria-hidden': 'true' });
  const start = el('div', { class: 'cam-start' }, [
    el('span', { class: 'ts-empty-icon', text: '◉' }),
    el('span', { class: 'ts-empty-title', 'data-i18n': 'camera.startTitle', text: 'Live camera effects' }),
    el('button', { type: 'button', class: 'btn btn-primary', 'data-i18n': 'camera.startCamera', text: '◉ Turn on camera', onclick: () => startCamera() }),
    el('button', { type: 'button', class: 'btn btn-outline', 'data-i18n': 'camera.useVideo', text: 'Use a video or photo', onclick: () => fileInput.click() }),
    el('button', { type: 'button', class: 'ts-empty-sample', 'data-i18n': 'camera.trySample', text: 'or try it with the sample image', onclick: () => useImage('../../assets/sample.jpg') }),
    el('p', { class: 'cam-note', 'data-i18n': 'camera.privacy', text: 'Everything happens on your device: the camera never leaves it.' }),
  ]);
  const stage = el('section', { class: 'ts-stage' }, [start, canvas, timerEl, flash, statusEl]);

  // Look chips + controls
  const chips = LOOKS.map((L, i) => el('button', { type: 'button', class: 'ts-chip', 'data-i18n': L.label, text: L.fb, onclick: () => setLook(i) }));
  const controlsBox = el('div');
  const btn = (icon, key, fb, extra = {}) => el('button', { type: 'button', class: 'ts-btn' + (extra.primary ? ' ts-btn-primary' : ''), ...(extra.attrs || {}) }, [
    el('span', { class: 'ts-btn-icon', 'aria-hidden': 'true', text: icon }),
    el('span', { class: 'ts-btn-label', 'data-i18n': key, text: fb }),
  ]);
  const srcBtn = btn('⤒', 'camera.video', 'Video');
  const flipBtn = btn('⇄', 'camera.flip', 'Flip');
  const recBtn = btn('●', 'camera.record', 'Record');
  const shotBtn = btn('◉', 'camera.photo', 'Photo', { primary: true });

  const toggle = (key, label, fb, onChange) => {
    const input = el('input', { type: 'checkbox', class: 'ts-switch', role: 'switch', id: 'opt-' + key });
    input.checked = !!state[key];
    input.addEventListener('change', () => { state[key] = input.checked; store.set(key, input.checked); onChange && onChange(); });
    return el('div', { class: 'ts-row ts-row-toggle' }, [el('label', { for: 'opt-' + key, 'data-i18n': label, text: fb }), input]);
  };
  const quality = el('select', { class: 'ts-select', id: 'opt-quality' }, [
    el('option', { value: '720', text: '720p' }), el('option', { value: '1080', text: '1080p' })]);
  quality.value = String(state.quality);

  recBtn.addEventListener('click', () => {
    if (!state.source) return;
    if (state.recorder) { stopRecording(state.exporting); return; }   // during an export the button cancels
    if (state.kind === 'video') exportVideo(); else startRecording();
  });
  function setLabel(b, key, fb, icon) {
    b.querySelector('.ts-btn-icon').textContent = icon;
    const l = b.querySelector('.ts-btn-label');
    l.setAttribute('data-i18n', key); l.textContent = t(key, fb);
  }

  /* ── Misc ───────────────────────────────────────────── */
  let statusTimer;
  function status(msg) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('is-on', !!msg);
    clearTimeout(statusTimer);
    if (msg) statusTimer = setTimeout(() => statusEl.classList.remove('is-on'), 5000);
  }
  fetch('../../gallery/gallery.json', { cache: 'no-cache' }).then(r => (r.ok ? r.json() : null)).then(g => {
    if (g && typeof g.formUrl === 'string' && /^https:\/\//.test(g.formUrl)) { galleryLink.href = g.formUrl; galleryLink.hidden = false; }
  }).catch(() => {});
  document.addEventListener('pudrus:i18n', () => {
    if (state.recorder) setLabel(recBtn, state.exporting ? 'camera.cancel' : 'camera.stop', state.exporting ? 'Cancel' : 'Stop', '■');
    else idleRecLabel();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.recorder) stopRecording();   // phones kill the camera in background anyway
  });
  window.addEventListener('pagehide', stopStream);

  [recBtn, shotBtn].forEach(b => { b.disabled = true; });
  state.mirrorRow = document.getElementById('opt-mirror') && document.getElementById('opt-mirror').closest('.ts-row');
  state.videoAudioRow = document.getElementById('opt-videoAudio') && document.getElementById('opt-videoAudio').closest('.ts-row');
  if (state.videoAudioRow) state.videoAudioRow.hidden = true;
  buildControls();
  if (!gl) {
    status(t('camera.noWebgl', 'Your browser does not support WebGL, which this tool needs.'));
  } else {
    try { initGL(); requestAnimationFrame(frame); }
    catch (err) { console.error(err); status('WebGL: ' + err.message); }
  }
  // Link hooks: ?sample=1 starts with the sample image, ?look=<id> opens a look
  const q = new URLSearchParams(location.search);
  const lookParam = LOOKS.findIndex(L => L.id === q.get('look'));
  if (lookParam >= 0) setLook(lookParam);
  if (q.get('sample') === '1') useImage('../../assets/sample.jpg');
  // Video or photo shared from the phone's gallery ("Share to PUDRUS", see /sw.js and /share/)
  if (q.get('shared') === '1' && window.caches) {
    caches.open('pudrus-share').then(c => c.match('/__shared-media').then(res => res && res.blob().then(b => {
      c.delete('/__shared-media');
      if (!b.size) return;
      const url = URL.createObjectURL(b);
      if (b.type.startsWith('image/')) useImage(url); else useVideo(url);
    }))).catch(() => {});
  }
  // Image handed over from another tool ("Send to…")
  try {
    const handed = sessionStorage.getItem('pudrus_workflow_image');
    if (handed) { sessionStorage.removeItem('pudrus_workflow_image'); useImage(handed); }
  } catch (e) { /* storage unavailable */ }
  const vid = q.get('video');   // same-site path only, e.g. ?video=/media/clip.mp4
  if (vid && /^\/[\w\/.-]+$/.test(vid)) useVideo(vid);
})();
</script>
<script src="/js/pwa.js"></script>
</body>
</html>
